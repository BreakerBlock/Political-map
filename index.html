<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BharatYatra — India Travel Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --parchment:#F5EDE0;--surface:#FFFDF8;--surface-hover:#F0E8DA;
  --border:#D9CEBA;--border-light:#E8DFCF;
  --ink:#2C1810;--ink-dim:#7A6B5D;--ink-light:#A89882;
  --accent:#B5452A;--accent-hover:#973A22;
}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#FFF6EA 0%,var(--surface) 45%,#F1F8EF 100%);flex-shrink:0;position:relative;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,#FF9933 0 33.3%,#FFFDF8 33.3% 66.6%,#138808 66.6%);opacity:.85}
.brand{display:flex;align-items:center;gap:10px}
.brand-flag{width:36px;height:36px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border);flex-shrink:0}
.brand-flag span:nth-child(1){flex:1;background:#FF9933}
.brand-flag span:nth-child(2){flex:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000080;line-height:1}
.brand-flag span:nth-child(3){flex:1;background:#138808}
header h1{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700}
header h1 span{color:var(--accent)}
.header-sub{font-size:0.58rem;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-dim)}
.btn-suggest{padding:8px 18px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;font-size:0.75rem;font-weight:600;transition:background 0.15s;display:flex;align-items:center;gap:7px;text-decoration:none}
.btn-suggest:hover{background:var(--accent-hover)}

.main-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* ── Filters panel ── */
.filters{padding:12px 14px 10px;border-bottom:1px solid var(--border-light)}
.filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.filters-head h2{font-family:'Cormorant Garamond',serif;font-size:0.85rem;font-weight:700;color:var(--ink-dim)}
.cat-toggle{border:none;background:none;display:flex;align-items:center;gap:6px;cursor:default;font-family:inherit;padding:0;color:inherit}
.chev{display:none;transition:transform 0.2s;color:var(--ink-dim);flex-shrink:0}
.pc-chev{margin-left:auto}
.total-badge~.pc-chev{margin-left:8px}
.toggle-all{font-size:0.62rem;color:var(--accent);cursor:pointer;font-weight:600;border:none;background:none;font-family:inherit}
.toggle-all:hover{text-decoration:underline}

.cat-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cat-btn{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:9px;border:1.5px solid var(--border-light);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;font-size:0.72rem;transition:all 0.12s;white-space:nowrap}
.cat-btn:hover{background:var(--surface-hover)}
.cat-btn.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:600}
.cat-swatch{width:18px;height:18px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cat-swatch svg{width:11px;height:11px}
.cat-cnt{font-size:0.6rem;color:var(--ink-light);font-weight:600;margin-left:auto;padding-left:4px}
.cat-btn:not(.active){color:var(--ink-dim)}
.cat-btn:not(.active) .cat-swatch{opacity:.7}
.filter-row{display:contents}
.cat-summary,.cat-panel-head,.cat-check{display:none}

/* ── State filter ── */
.state-filter{padding:8px 14px;border-bottom:1px solid var(--border-light);display:flex;gap:8px;align-items:center}
.state-filter label{font-size:0.68rem;color:var(--ink-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap}
.state-filter select{flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--parchment);color:var(--ink);font-family:inherit;font-size:0.78rem;outline:none;cursor:pointer}
.state-filter select:focus{border-color:var(--accent)}

/* ── Search ── */
.search-wrap{padding:8px 14px;border-bottom:1px solid var(--border-light);position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid var(--border);background:var(--parchment);color:var(--ink);font-family:inherit;font-size:0.8rem;outline:none}
.search-wrap input::placeholder{color:var(--ink-light)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,69,42,0.08)}
.s-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-light);fill:none;stroke-width:2}

.place-count{padding:7px 14px;font-size:0.66rem;color:var(--ink-light);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px;cursor:default}
.place-count .total-badge{margin-left:auto;font-size:0.6rem;color:var(--ink-light);font-weight:500;white-space:nowrap}

/* ── Place list ── */
.place-list{flex:1;overflow-y:auto;padding:4px 8px}
.place-list::-webkit-scrollbar{width:4px}
.place-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.place-list{padding:6px 8px 10px}
.place-card{position:relative;padding:10px 10px 10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:flex-start;gap:11px;border:1px solid transparent;transition:background .15s,box-shadow .18s,transform .18s,border-color .15s;animation:cardIn .28s ease both}
.place-card+.place-card{margin-top:2px}
.place-card::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c);opacity:0;transition:opacity .15s}
.place-card:hover{background:#fff;border-color:var(--border-light);box-shadow:0 4px 14px rgba(44,24,16,0.08);transform:translateX(2px)}
.place-card:hover::before,.place-card.sel::before{opacity:1}
.place-card.sel{background:color-mix(in srgb,var(--c) 7%,#fff);border-color:color-mix(in srgb,var(--c) 30%,transparent)}
@keyframes cardIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pc-swatch{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,0.12),0 2px 6px rgba(44,24,16,0.12)}
.pc-swatch svg{width:17px;height:17px}
.pc-text{flex:1;min-width:0}
.place-card h3{font-size:0.82rem;font-weight:600;line-height:1.25;color:var(--ink)}
.pc-meta{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:0.62rem;color:var(--ink-light);white-space:nowrap;overflow:hidden}
.pc-meta .pc-cat{color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:0.56rem}
.pc-meta i{width:3px;height:3px;border-radius:50%;background:var(--ink-light);flex-shrink:0}
.place-card p{font-size:0.7rem;color:var(--ink-dim);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-add{flex-shrink:0;align-self:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--accent);font:600 16px/1 'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .15s,background .15s,border-color .15s,color .15s,transform .15s}
.place-card:hover .pc-add,.pc-add.in{opacity:1}
.pc-add:hover{border-color:var(--accent);transform:scale(1.08)}
.pc-add.in{background:var(--accent);border-color:var(--accent);color:#fff;font-size:13px}

/* ── Map ── */
#map{flex:1;background:#B9D3DC;position:relative}
.tile-terrain{filter:saturate(1.15) contrast(1.05) brightness(1.02)}
.tile-sat{filter:saturate(1.08) contrast(1.03)}
body.sat-on .india-mask{fill-opacity:0.35}
body.sat-on .india-fill{fill-opacity:0}
.map-vignette{position:absolute;inset:0;pointer-events:none;z-index:350;box-shadow:inset 0 0 70px 6px rgba(30,40,50,0.14)}
.base-toggle{display:flex;background:rgba(255,253,248,0.94);border-radius:10px;padding:3px;box-shadow:0 2px 10px rgba(44,24,16,0.18);backdrop-filter:blur(6px)}
.base-toggle button{border:none;background:none;font:600 11px 'DM Sans',sans-serif;color:var(--ink-dim);padding:6px 10px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s}
.base-toggle button.on{background:var(--ink);color:#fff}
.compass{position:absolute;left:12px;bottom:32px;z-index:800;width:54px;height:54px;opacity:0.45;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(255,253,248,0.8))}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--border)!important;font-size:16px!important;width:32px!important;height:32px!important;line-height:32px!important}

/* ── Cluster styling ── */
.marker-cluster{background:transparent!important}
.marker-cluster div{
  width:38px!important;height:38px!important;margin-left:0!important;margin-top:0!important;
  border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  font-family:'DM Sans',sans-serif!important;font-weight:700!important;font-size:12.5px!important;
  background:rgba(255,253,248,0.96)!important;color:var(--ink)!important;
  box-shadow:0 0 0 4px var(--ring),0 4px 14px rgba(44,24,16,0.35)!important;border:none!important;
  transition:transform .15s ease;
}
.marker-cluster:hover div{transform:scale(1.08)}
.marker-cluster-small{--ring:rgba(19,136,8,0.55)}
.marker-cluster-medium{--ring:rgba(255,153,51,0.75)}
.marker-cluster-large{--ring:rgba(181,69,42,0.8)}
.pin{position:relative;width:30px;height:38px;cursor:pointer;transition:transform .15s ease;transform-origin:50% 100%;filter:drop-shadow(0 3px 4px rgba(30,20,10,0.35))}
.pin:hover{transform:scale(1.15)}
.pin svg.drop{position:absolute;inset:0;width:30px;height:38px}
.pin .ico{position:absolute;left:7px;top:6px;width:16px;height:16px;display:flex}
.pin .ico svg{width:16px;height:16px}

/* ── Popup ── */
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--ink)!important;border-radius:16px!important;box-shadow:0 18px 40px -8px rgba(44,24,16,0.35),0 2px 6px rgba(44,24,16,0.12)!important;border:none!important;overflow:hidden!important;padding:0!important}
.leaflet-popup-tip{background:var(--surface)!important;box-shadow:0 3px 8px rgba(44,24,16,0.2)!important}
.leaflet-popup-content{font-family:'DM Sans',sans-serif!important;font-size:13px!important;line-height:1.5!important;margin:0!important;width:var(--pw,280px)!important}
/* animate the inner parts: Leaflet positions .leaflet-popup itself with a transform */
.leaflet-popup-content-wrapper,.leaflet-popup-tip-container{animation:popIn .22s cubic-bezier(.2,.9,.3,1.2) both;transform-origin:50% 100%}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.pop-hero{position:relative;height:168px;overflow:hidden;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#2C1810));color:#fff}
.pop-hero.noimg{height:112px}
.pop-hero .ph-glyph{position:absolute;right:6px;bottom:-26px;width:120px;height:120px;opacity:.16}
.pop-hero .ph-glyph svg{width:100%;height:100%}
.pop-hero.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.pop-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s ease,transform 6s ease;transform:scale(1.04)}
.pop-hero img.ok{opacity:1;transform:scale(1)}
.pop-hero::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(20,12,6,.78) 0%,rgba(20,12,6,.25) 45%,rgba(20,12,6,0) 70%),linear-gradient(to bottom,rgba(20,12,6,.35),rgba(20,12,6,0) 30%)}
.pop-chip{position:absolute;z-index:2;left:12px;top:11px;display:flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border-radius:20px;background:rgba(255,253,248,.95);color:var(--c);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.pop-chip span{width:17px;height:17px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center}
.pop-chip svg{width:10px;height:10px}
.pop-title{position:absolute;z-index:2;left:14px;right:14px;bottom:10px}
.pop-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.pop-state{font-size:11.5px;opacity:.92;margin-top:3px;display:flex;align-items:center;gap:4px}
.pop-state svg{width:11px;height:11px;flex-shrink:0}
.pop-body{padding:11px 14px 13px}
.pop-desc{font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.pop-links{display:flex;gap:4px;margin-top:9px}
.pop-links a{white-space:nowrap;flex:1 1 auto;justify-content:center;min-width:0;overflow:hidden}
.pop-links a{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--ink-dim)!important;text-decoration:none;padding:5px 4px;border-radius:14px;background:var(--parchment);transition:background .15s,color .15s}
.pop-links a:hover{background:var(--surface-hover);color:var(--accent)!important}
.pop-links svg{width:11px;height:11px}
.leaflet-container a.leaflet-popup-close-button{color:#fff!important;background:rgba(20,12,6,.45);border-radius:50%;width:26px!important;height:26px!important;font:400 18px/24px 'DM Sans',sans-serif!important;text-align:center;top:9px!important;right:9px!important;z-index:10;backdrop-filter:blur(4px);transition:background .15s}
.leaflet-container a.leaflet-popup-close-button:hover{background:rgba(20,12,6,.7)}

.pin-label{
  background:rgba(255,253,248,0.92)!important;border:1px solid var(--border)!important;
  border-radius:5px!important;box-shadow:0 1px 4px rgba(44,24,16,0.15)!important;
  color:var(--ink)!important;font-family:'DM Sans',sans-serif!important;
  font-size:10px!important;font-weight:600!important;padding:2px 6px!important;white-space:nowrap!important;
}
.pin-label::before{display:none!important}
.leaflet-tooltip.pin-label{display:none}
body.show-pin-labels .leaflet-tooltip.pin-label{display:block}

.state-label{font-family:'Cormorant Garamond',serif!important;font-size:10.5px!important;font-weight:700!important;color:rgba(90,40,20,0.5)!important;letter-spacing:0.16em!important;text-transform:uppercase!important;white-space:nowrap!important;text-shadow:0 0 5px rgba(245,237,224,1)!important;pointer-events:none!important;text-align:center!important}
.city-label{font-family:'DM Sans',sans-serif!important;pointer-events:none!important;white-space:nowrap!important}
.cl-inner{display:flex;align-items:center;gap:4px}
.cl-dot{width:5px;height:5px;border-radius:50%;background:#5A4A3A;border:1px solid #fff;box-shadow:0 0 2px rgba(0,0,0,0.4);flex-shrink:0}
.cl-name{font-size:10px;font-weight:500;color:#4A3A2C;text-shadow:0 0 3px #fff,0 0 5px #fff,0 0 6px #fff}
.city-label.tier1 .cl-name{font-weight:600;font-size:10.5px}

.disclaimer{position:absolute;bottom:6px;left:10px;z-index:800;font-size:0.56rem;color:var(--ink-light);background:rgba(255,253,248,0.92);padding:3px 12px;border-radius:4px;white-space:nowrap}
.loading-overlay{position:absolute;inset:0;z-index:900;background:rgba(245,237,224,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--ink-dim);gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Places / Trip tabs ── */
.view-tabs{display:flex;background:var(--parchment);border:1px solid var(--border-light);border-radius:9px;padding:2px;gap:2px}
.vt{display:flex;align-items:center;gap:6px;border:none;background:none;border-radius:7px;padding:5px 11px;font:600 0.72rem 'DM Sans',sans-serif;color:var(--ink-dim);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.vt b{font-size:0.62rem;min-width:18px;padding:1px 6px;border-radius:9px;background:var(--border-light);color:var(--ink-dim);text-align:center;transition:background .15s,color .15s}
.vt:hover{color:var(--ink)}
.vt.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(44,24,16,0.14)}
.vt.on b{background:var(--accent);color:#fff}
#tripBtn.bump b{animation:bump .35s ease}
@keyframes bump{50%{transform:scale(1.35)}}

/* ── Trip planner: summary card + timeline ── */
.trip-panel{display:none;flex:1;overflow-y:auto;padding:10px 12px 14px}
body.trip-view .trip-panel{display:block}
body.trip-view .place-list{display:none!important}
.trip-empty{text-align:center;padding:22px 14px;color:var(--ink-dim);font-size:0.76rem;line-height:1.55}
.trip-empty svg{width:120px;height:64px;margin-bottom:8px}
.trip-empty h3{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--ink);margin-bottom:4px}
.trip-hero{position:relative;overflow:hidden;border-radius:14px;padding:12px 14px 11px;color:#fff;background:linear-gradient(135deg,#B5452A 0%,#8E3A24 55%,#5A2A1A 100%);box-shadow:0 8px 20px -8px rgba(90,42,26,0.55)}
.trip-hero::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:16px solid rgba(255,153,51,0.18)}
.th-title{font-size:0.6rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;opacity:.8}
.th-stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;position:relative;z-index:1}
.th-stats div{display:flex;flex-direction:column}
.th-stats b{font-family:'Cormorant Garamond',serif;font-size:1.22rem;line-height:1.1;font-weight:700}
.th-stats span{font-size:0.58rem;opacity:.8;text-transform:uppercase;letter-spacing:0.08em}
.n-short{display:none}
.trip-hero small{display:block;font-size:0.58rem;line-height:1.4;opacity:.78;margin-top:7px;position:relative;z-index:1}
.tl{list-style:none;margin:12px 0 4px}
.tl-stop{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 4px;border-radius:10px;transition:background .15s;animation:cardIn .25s ease both}
.tl-stop:hover{background:#fff;box-shadow:0 2px 10px rgba(44,24,16,0.07)}
.tl-num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-size:0.74rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2.5px solid #fff;box-shadow:0 0 0 1.5px var(--c),0 2px 6px rgba(44,24,16,0.25)}
.trip-info{flex:1;min-width:0;cursor:pointer}
.trip-info h3{font-size:0.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-info div{font-size:0.6rem;color:var(--ink-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-info div span{color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:0.55rem}
.trip-ctl{display:flex;gap:2px;opacity:.35;transition:opacity .15s}
.tl-stop:hover .trip-ctl,.tl-stop:focus-within .trip-ctl{opacity:1}
.trip-ctl button{width:26px;height:26px;border-radius:7px;border:none;background:none;color:var(--ink-dim);cursor:pointer;font-size:0.78rem;line-height:1;transition:background .15s,color .15s}
.trip-ctl button:hover:not(:disabled){background:var(--surface-hover);color:var(--ink)}
.trip-ctl button.rm:hover{color:var(--accent)}
.trip-ctl button:disabled{opacity:0.3;cursor:default}

.trip-actions button svg{width:13px;height:13px}
.trip-actions button:hover{background:#fff;border-color:var(--ink-light)}

.trip-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;grid-column:1/-1}
.trip-actions button.primary:hover{background:var(--accent-hover)}
.trip-actions button.ghost{border-color:transparent;background:none;color:var(--ink-light);font-weight:500}

.pop-trip{margin-top:10px;width:100%;padding:9px 10px;border-radius:10px;transition:background .15s,color .15s,transform .1s;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.pop-trip:hover{background:var(--accent-hover)}

.pop-trip.in{background:var(--surface);color:var(--accent)}
.route-num{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font:700 11px 'DM Sans',sans-serif;border:2px solid #fff;box-shadow:0 0 0 2px rgba(181,69,42,0.6),0 2px 6px rgba(44,24,16,0.45)}

button,a,.place-card,.cat-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

<body>
<header>
  <div class="brand">
    <div class="brand-flag"><span></span><span>☸</span><span></span></div>
    <div><h1>Bharat<span>Yatra</span></h1><div class="header-sub">Interactive India Travel Planner</div></div>

    <span class="bs-label">Suggest a Place</span>

<div class="main-wrap">
  <aside class="sidebar">

        <button class="cat-toggle" id="catToggle" onclick="toggleCatPanel(event)" aria-expanded="false" aria-controls="catPanel">

        </button>
        <button class="toggle-all" id="toggleAll" onclick="toggleAllCats()">Clear</button>
      </div>
      <div class="cat-panel" id="catPanel">
        <div class="cat-panel-head"><span>Show on map</span><button class="toggle-all" id="toggleAllM" onclick="toggleAllCats()">Clear</button><button class="cat-done" onclick="closeCatPanel()">Done</button></div>
        <div class="cat-list" id="catBtns" role="group" aria-label="Categories"></div>
      </div>
    </div>
    <div class="state-filter">
      <label for="stateSelect">State</label>
      <select id="stateSelect" onchange="onStateSelect(this.value)" aria-label="State"><option value="">All India</option></select>
    </div>
    </div>

      <svg class="s-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>

</div>

<script>
const CONTACT_EMAIL='utkarsh.khurana@outlook.com';
const DATA_BASE='';

const ICONS={
scenic:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l4-10 4 10"/><path d="M2 21l5-12 3 6"/><circle cx="18" cy="5" r="2"/></svg>`,

arts:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4l-8.5 8.5"/><path d="M11.5 12.5c-2.2.8-3.3 1.9-3.9 4.6-.2 1 .8 2.1 1.9 1.9 2.7-.6 3.8-1.7 4.6-3.9l-2.6-2.6z"/><path d="M17 2l5 5-2 2-5-5 2-2z"/></svg>`,
cuisine:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M5 12c0-4 3-8 7-8s7 4 7 8M5 12v2c0 3 3 5 7 5s7-2 7-5v-2"/></svg>`,
adventure:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l-4 8h8l-4-8z"/><path d="M8 10l-5 10h18l-5-10"/><path d="M12 8v14"/></svg>`,
festivals:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M5.6 5.6l2.8 2.8M2 12h4M5.6 18.4l2.8-2.8M12 18v4M18.4 18.4l-2.8-2.8M22 12h-4M18.4 5.6l-2.8 2.8"/><circle cx="12" cy="12" r="3"/></svg>`,
};
const CATS={scenic:{label:'Scenic',color:'#1A7A6D'},religious:{label:'Spiritual',color:'#C4563A'},fauna:{label:'Wildlife',color:'#3D7A35'},history:{label:'Heritage',color:'#8B6914'},arts:{label:'Arts & Crafts',color:'#8B3FA0'},cuisine:{label:'Cuisine',color:'#D06B25'},adventure:{label:'Adventure',color:'#2260BD'},festivals:{label:'Festivals',color:'#C73E6B'}};
const activeCats=new Set(Object.keys(CATS));

/* ── State ── */
let statesIndex={};
let allPlaces=[];        // currently loaded (highlights + expanded states)
let loadedStates={};     // {SC: [places]}
let highlightPlaces=[];
let selectedState='';
let totalPlaces=0;
const imgCache={};

/* ── City and state labels ── */
const STATE_LABELS=[["J&K",33.6,74.9],["LADAKH",34.4,77.6],["HIMACHAL",31.9,77.3],["PUNJAB",30.9,75.4],["HARYANA",29.2,76.1],["UTTARAKHAND",30.1,79.2],["RAJASTHAN",26.6,73.0],["UTTAR PRADESH",27.0,80.5],["BIHAR",25.7,85.6],["GUJARAT",22.6,71.6],["MADHYA PRADESH",23.4,78.6],["CHHATTISGARH",21.5,82.0],["JHARKHAND",23.6,85.5],["WEST BENGAL",24.0,87.9],["ODISHA",20.4,84.6],["MAHARASHTRA",19.3,76.2],["TELANGANA",17.9,79.1],["ANDHRA PRADESH",15.7,79.9],["KARNATAKA",14.8,76.1],["GOA",15.35,74.05],["KERALA",10.4,76.4],["TAMIL NADU",11.0,78.5],["ASSAM",26.3,92.9],["MEGHALAYA",25.5,91.2],["ARUNACHAL",28.1,94.6],["NAGALAND",26.1,94.4],["MANIPUR",24.7,93.9],["MIZORAM",23.3,92.9],["TRIPURA",23.8,91.7],["SIKKIM",27.6,88.5],["DELHI",28.65,77.1]];
const CITIES_T1=[["New Delhi",28.61,77.21],["Mumbai",19.08,72.88],["Kolkata",22.57,88.36],["Chennai",13.08,80.27],["Bengaluru",12.97,77.59],["Hyderabad",17.39,78.49],["Ahmedabad",23.02,72.57],["Pune",18.52,73.86],["Jaipur",26.92,75.79],["Lucknow",26.85,80.95],["Srinagar",34.08,74.80],["Leh",34.15,77.58],["Chandigarh",30.73,76.78],["Bhopal",23.26,77.41],["Patna",25.59,85.14],["Guwahati",26.14,91.74],["Kochi",9.93,76.27],["Panaji",15.49,73.83],["Varanasi",25.32,83.01],["Amritsar",31.63,74.87],["Indore",22.72,75.86]];
const CITIES_T2=[["Shimla",31.10,77.17],["Dehradun",30.32,78.03],["Jammu",32.73,74.86],["Ranchi",23.34,85.31],["Raipur",21.25,81.63],["Bhubaneswar",20.30,85.82],["Thiruvananthapuram",8.52,76.94],["Madurai",9.93,78.12],["Coimbatore",11.02,76.96],["Mysuru",12.30,76.64],["Mangaluru",12.91,74.86],["Surat",21.17,72.83],["Vadodara",22.31,73.19],["Jodhpur",26.24,73.02],["Udaipur",24.58,73.68],["Agra",27.18,78.02],["Prayagraj",25.44,81.85],["Nashik",20.00,73.79],["Visakhapatnam",17.69,83.22],["Nagpur",21.15,79.09],["Imphal",24.82,93.94],["Shillong",25.57,91.88],["Gangtok",27.33,88.62],["Siliguri",26.73,88.40],["Dharamshala",32.22,76.32],["Rishikesh",30.09,78.27],["Port Blair",11.62,92.73]];

/* ══════ MAP ══════ */
// Full extent of India's official boundary, incl. all of J&K and Ladakh (Gilgit-Baltistan, Aksai Chin)
const INDIA_BOUNDS=[[6.5,68.1],[37.1,97.4]];
const map=L.map('map',{zoomControl:true,minZoom:4,zoomSnap:0.25,maxBounds:[[3,60],[40,102]],maxBoundsViscosity:0.85});
// Fit the whole country into whatever space the map has (phones used to open on a zoom-5 view that cut off Kashmir and the south)
function showAllIndia(animate){map.fitBounds(INDIA_BOUNDS,{padding:[8,8],animate:!!animate})}
showAllIndia();
/* Basemaps: key-free Esri tiles with NO drawn borders or labels, so india-boundary.geojson
   is the only boundary on the map. Terrain for the overview; satellite imagery when zoomed in
   (terrain only goes to native z13), or always if the visitor picks "Satellite". */
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const terrainTiles=L.tileLayer(ESRI+'World_Terrain_Base/MapServer/tile/{z}/{y}/{x}',{attribution:'Terrain &copy; Esri, USGS, NOAA',maxNativeZoom:13,maxZoom:19,className:'tile-terrain'});
const satTiles=L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics',maxNativeZoom:18,maxZoom:19,className:'tile-sat'});
const SAT_FROM_ZOOM=11;
let baseMode='map'; // 'map' = terrain → satellite when zoomed in; 'sat' = satellite always
function syncBasemap(){
  const wantSat=baseMode==='sat'||map.getZoom()>=SAT_FROM_ZOOM;
  const on=wantSat?satTiles:terrainTiles,off=wantSat?terrainTiles:satTiles;
  if(!map.hasLayer(on))on.addTo(map).bringToBack();
  if(map.hasLayer(off))map.removeLayer(off);
  document.body.classList.toggle('sat-on',wantSat);
}
const BaseToggle=L.Control.extend({options:{position:'topright'},onAdd(){
  const d=L.DomUtil.create('div','base-toggle');
  d.innerHTML='<button data-m="map" class="on">Map</button><button data-m="sat">Satellite</button>';
  L.DomEvent.disableClickPropagation(d);
  d.onclick=e=>{const b=e.target.closest('button');if(!b)return;baseMode=b.dataset.m;d.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));syncBasemap()};
  return d;
}});
new BaseToggle().addTo(map);
map.on('zoomend',syncBasemap);syncBasemap();
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);

const clusters=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true,showCoverageOnHover:false,zoomToBoundsOnClick:true,disableClusteringAtZoom:12});
map.addLayer(clusters);

// Label layers
function mkLabel(text,lat,lng,cls){return L.marker([lat,lng],{icon:L.divIcon({className:cls,html:cls==='state-label'?text:`<div class="cl-inner"><span class="cl-dot"></span><span class="cl-name">${text}</span></div>`,iconSize:cls==='state-label'?[120,14]:[110,14],iconAnchor:cls==='state-label'?[60,7]:[3,7]}),interactive:false})}
const stateLayer=L.layerGroup(STATE_LABELS.map(s=>mkLabel(s[0],s[1],s[2],'state-label'))).addTo(map);
const cityT1=L.layerGroup(CITIES_T1.map(c=>mkLabel(c[0],c[1],c[2],'city-label tier1')));
const cityT2=L.layerGroup(CITIES_T2.map(c=>mkLabel(c[0],c[1],c[2],'city-label tier2')));

function syncLabels(){
  const z=map.getZoom();
  [stateLayer,cityT1,cityT2].forEach(l=>{if(map.hasLayer(l))map.removeLayer(l)});
  if(z>=4.5&&z<8)map.addLayer(stateLayer);
  if(z>=4.5)map.addLayer(cityT1);
  if(z>=7)map.addLayer(cityT2);
  document.body.classList.toggle('show-pin-labels',z>=9);
}
map.on('zoomend',syncLabels);syncLabels();

/* ── Boundary ── */
async function loadBoundary(){
  try{
    const r=await fetch('india-boundary.geojson');if(!r.ok)throw 0;
    const g=await r.json();
    const holes=g.features[0].geometry.coordinates.map(p=>p[0].map(pt=>[pt[1],pt[0]]));
    // Neighbouring countries fade into a soft mist so India stands out
    L.polygon([[ [-89,-179],[-89,179],[89,179],[89,-179] ],...holes],{stroke:false,fillColor:'#EEF1F2',fillOpacity:0.62,interactive:false,className:'india-mask'}).addTo(map);
    // Saffron halo + crisp ink line
    L.geoJSON(g,{style:{color:'#F2A541',weight:9,opacity:0.28,fill:false,lineJoin:'round'},interactive:false}).addTo(map);
    L.geoJSON(g,{style:{color:'#7A2E14',weight:1.8,opacity:0.95,fillColor:'#FFE6BF',fillOpacity:0.14,lineJoin:'round',className:'india-fill'},interactive:false}).addTo(map);
  }catch(e){console.warn('Boundary:',e)}
}
loadBoundary();

/* ── Auto-load state data when zoomed into a region ── */
// Loads the nearest state plus any state whose centre falls inside the (padded) view,
// then re-renders so the newly loaded pins actually appear.
map.on('moveend',async()=>{
  if(map.getZoom()<7||selectedState)return;
  const c=map.getCenter(),view=map.getBounds().pad(0.25);
  const want=new Set();
  let best='',bestD=Infinity;
  for(const[sc,s] of Object.entries(statesIndex)){
    const d=Math.hypot(c.lat-s.lat,c.lng-s.lng);
    if(d<bestD){bestD=d;best=sc}
    if(view.contains([s.lat,s.lng]))want.add(sc);
  }
  if(best&&bestD<4)want.add(best);
  const todo=[...want].filter(sc=>!loadedStates[sc]);
  if(!todo.length)return;
  await Promise.all(todo.map(loadStateData));
  render();
});

/* ══════ DATA LOADING ══════ */
async function init(){
  try{
    const [hlRes,siRes]=await Promise.all([
      fetch(DATA_BASE+'highlights.json?v='+Date.now()),
      fetch(DATA_BASE+'states-index.json?v='+Date.now())
    ]);
    if(!hlRes.ok||!siRes.ok)throw new Error('init fetch failed');
    const hlData=await hlRes.json();
    const siData=await siRes.json();
    highlightPlaces=hlData.places;
    totalPlaces=hlData.total;
    statesIndex=siData;
    allPlaces=[...highlightPlaces];
    populateStateSelect();
  }catch(e){console.warn('Init:',e.message)}
  document.getElementById('loader').style.display='none';
  render();
}

const statePending={};
function loadStateData(sc){
  if(loadedStates[sc])return Promise.resolve(loadedStates[sc]);
  if(!statePending[sc])statePending[sc]=fetchStateData(sc).finally(()=>{delete statePending[sc]});
  return statePending[sc];
}
async function fetchStateData(sc){
  try{
    // State files live next to index.html (e.g. kl.json); fall back to the older states/ folder layout.
    const f=sc.toLowerCase()+'.json',v='?v='+Date.now();
    let r=await fetch(DATA_BASE+f+v);
    if(!r.ok)r=await fetch(DATA_BASE+'states/'+f+v);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    loadedStates[sc]=d.places;
    // Merge: replace highlights for this state with full state data
    allPlaces=allPlaces.filter(p=>p.stateCode!==sc).concat(d.places);
    return d.places;
  }catch(e){console.warn('State load:',sc,e);return []}
}

function populateStateSelect(){
  const sel=document.getElementById('stateSelect');
  sel.innerHTML='<option value="">All India</option>';
  const sorted=Object.entries(statesIndex).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  sorted.forEach(([sc,s])=>{
    const o=document.createElement('option');
    o.value=sc;o.textContent=`${s.name} (${s.count})`;
    sel.appendChild(o);
  });
}

async function onStateSelect(sc){
  selectedState=sc;
  if(sc){
    await loadStateData(sc);
    const s=statesIndex[sc];
    map.setView([s.lat,s.lng],7,{animate:true});
  }else{
    showAllIndia(true);
  }
  render();
}

/* ══════ MARKERS ══════ */
function makeIcon(cat){
  const c=CATS[cat]||CATS.scenic;
  // Teardrop pin in the category colour, white rim, category glyph inside
  return L.divIcon({className:'',html:`<div class="pin"><svg class="drop" viewBox="0 0 30 38"><path d="M15 37C15 37 2 22.5 2 14a13 13 0 0126 0c0 8.5-13 23-13 23z" fill="${c.color}" stroke="#fff" stroke-width="2.2"/></svg><span class="ico">${ICONS[cat]||ICONS.scenic}</span></div>`,iconSize:[30,38],iconAnchor:[15,37],popupAnchor:[0,-34],tooltipAnchor:[12,-22]});
}
const esc=t=>String(t??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const PIN_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const LINK_ICONS={
 dir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
 wiki:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v14H4zM14 5h6v14h-6z"/></svg>',
 edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>'};
// Popup width: 280px, narrower on small phones so it never touches the screen edges

function editMailto(p){
  const sub=`BharatYatra — Edit: ${p.name} (${p.state})`;
  const body=`Hi,\n\nI'd like to suggest a correction for "${p.name}" (${p.state}).\n\nCurrently on the map:\n- Category: ${(CATS[p.cat]||{}).label||p.cat}\n- Location: ${p.lat}, ${p.lng}\n- Description: ${p.desc||''}\n\nWhat should change (and a source, if you have one):\n\n\nThanks!`;
  return `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
}
// img: a URL, or null. While a Wikipedia photo is still being fetched the hero shows a shimmer.
function popupHTML(p,img){
  const c=CATS[p.cat]||CATS.scenic;
  const loading=!img&&p.wiki&&imgCache[p.wiki]===undefined;
  const hero=`<div class="pop-hero${img?'':loading?' loading':' noimg'}" style="--c:${c.color}">`
    +`<div class="ph-glyph">${ICONS[p.cat]||ICONS.scenic}</div>`
    +(img?`<img src="${esc(img)}" alt="${esc(p.name)}" onload="this.classList.add('ok')" onerror="this.parentElement.classList.add('noimg');this.remove()">`:'')
    +`<div class="pop-chip"><span>${ICONS[p.cat]||ICONS.scenic}</span>${c.label}</div>`
    +`<div class="pop-title"><div class="pop-name">${esc(p.name)}</div><div class="pop-state">${PIN_SVG}${esc(p.state)}</div></div></div>`;
  const links=`<div class="pop-links">`
    +`<a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">${LINK_ICONS.dir}Directions</a>`
    +(p.wiki?`<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(p.wiki)}" target="_blank" rel="noopener">${LINK_ICONS.wiki}Wikipedia</a>`:'')
    +`<a href="${editMailto(p)}" title="Email a correction to BharatYatra">${LINK_ICONS.edit}Suggest edit</a></div>`;
  return `${hero}<div class="pop-body"><div class="pop-desc">${esc(p.desc)}</div>${links}${tripBtnHTML(p)}</div>`;
}
async function getImage(p){
  if(p.img)return p.img;if(!p.wiki)return null;if(imgCache[p.wiki]!==undefined)return imgCache[p.wiki];
  try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki));if(!r.ok)throw 0;const j=await r.json();const u=(j.thumbnail&&j.thumbnail.source)?j.thumbnail.source.replace(/\/\d+px-/,'/500px-'):null;imgCache[p.wiki]=u;return u}catch(e){imgCache[p.wiki]=null;return null}
}

/* ══════ RENDER ══════ */
const placeKey=p=>p.stateCode+'|'+p.name;
let markerByKey={};
function render(){
  // Remember an open popup so a re-render (e.g. after a state auto-loads) doesn't close it
  let reopen=null;
  for(const[k,m] of Object.entries(markerByKey)){if(m.isPopupOpen&&m.isPopupOpen()){reopen=k;break}}
  clusters.clearLayers();markerByKey={};
  document.getElementById('map').style.setProperty('--pw',popW()+'px');
  const listEl=document.getElementById('placeList');listEl.innerHTML='';
  const q=(document.getElementById('searchInput').value||'').toLowerCase();

  let pool=selectedState?allPlaces.filter(p=>p.stateCode===selectedState):allPlaces;
  const visible=pool.filter(p=>activeCats.has(p.cat)&&(!q||p.name.toLowerCase().includes(q)||p.state.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)));
  visible.sort((a,b)=>{const d=Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat);return d||a.name.localeCompare(b.name)});

  const markers=[];
  visible.forEach(p=>{
    const c=CATS[p.cat]||CATS.scenic;
    const m=L.marker([p.lat,p.lng],{icon:makeIcon(p.cat)});
    m.bindPopup(()=>popupHTML(p,p.img||imgCache[p.wiki]||null),{maxWidth:popW(),minWidth:popW(),autoPanPaddingTopLeft:[16,64],autoPanPaddingBottomRight:[16,36]});
    m.bindTooltip(p.name,{permanent:true,direction:'right',offset:[2,0],className:'pin-label'});
    m.on('popupopen',async()=>{
      selectCard(placeKey(p));
      const had=imgCache[p.wiki]!==undefined,u=await getImage(p);
      if(!had&&m.isPopupOpen())m.getPopup().setContent(popupHTML(p,u));
    });
    m.on('popupclose',()=>selectCard(null));
    m._place=p;
    markers.push(m);markerByKey[placeKey(p)]=m;

    const card=document.createElement('div');
    card.className='place-card';card.style.setProperty('--c',c.color);card.style.animationDelay=Math.min(listEl.childElementCount,12)*18+'ms';
    const k=placeKey(p);card.dataset.key=k;
    card.innerHTML=`<div class="pc-swatch" style="background:${c.color}">${ICONS[p.cat]||ICONS.scenic}</div><div class="pc-text"><h3>${esc(p.name)}</h3><div class="pc-meta"><span class="pc-cat">${c.label}</span><i></i><span>${esc(p.state)}</span></div><p>${esc(p.desc)}</p></div><button class="pc-add" aria-label="Add to trip"></button>`;
    card.onclick=()=>focusPlace(p);
    card.querySelector('.pc-add').onclick=e=>{e.stopPropagation();toggleTrip(k)};
    listEl.appendChild(card);
  });
  clusters.addLayers(markers);
  syncCardTripBtns();
  if(reopen&&markerByKey[reopen]){const m=markerByKey[reopen];clusters.zoomToShowLayer(m,()=>m.openPopup())}

  document.getElementById('placeCountN').textContent=visible.length;
  document.getElementById('totalBadge').textContent=totalPlaces?`of ${totalPlaces}`:'';
  renderCatBtns();
}

/* ══════ TRIP PLANNER ══════
   Trip = ordered list of place keys ("SC|Name"). Saved in localStorage and
   shareable via #trip=… in the URL. Legs use road distance from OSRM, falling back to straight-line. */
const TRIP_LS='bharatyatra.trip.v1';
let trip=[];
const tripLayer=L.layerGroup().addTo(map);
const findPlace=k=>allPlaces.find(p=>placeKey(p)===k);
const inTrip=p=>trip.includes(placeKey(p));
function tripBtnHTML(p){
  const k=encodeURIComponent(placeKey(p));
  return inTrip(p)
    ?`<button class="pop-trip in" data-trip="${k}">✓ In your trip — remove</button>`
    :`<button class="pop-trip" data-trip="${k}">+ Add to trip</button>`;
}
function km(a,b){
  const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=d=>d<10?d.toFixed(1)+' km':Math.round(d).toLocaleString('en-IN')+' km';
function saveTrip(){try{localStorage.setItem(TRIP_LS,JSON.stringify(trip))}catch(e){}}
function tripStops(){return trip.map(findPlace).filter(Boolean)}
function toggleTrip(key){
  const i=trip.indexOf(key);
  if(i>=0)trip.splice(i,1);else trip.push(key);
  tripChanged();
  const tb=document.getElementById('tripBtn');tb.classList.remove('bump');void tb.offsetWidth;if(i<0)tb.classList.add('bump');
}
function moveStop(i,d){const j=i+d;if(j<0||j>=trip.length)return;[trip[i],trip[j]]=[trip[j],trip[i]];tripChanged()}
function removeStop(i){trip.splice(i,1);tripChanged()}
function clearTrip(){if(trip.length&&confirm('Remove all stops from your trip?')){trip=[];tripChanged()}}
// Nearest-neighbour ordering from the first stop, then 2-opt to remove crossings.
function optimiseTrip(){
  const st=tripStops();if(st.length<3)return;
  const rest=st.slice(1),ord=[st[0]];
  while(rest.length){const last=ord[ord.length-1];let bi=0;rest.forEach((p,i)=>{if(km(last,p)<km(last,rest[bi]))bi=i});ord.push(rest.splice(bi,1)[0])}
  let improved=true;
  while(improved){improved=false;
    for(let i=1;i<ord.length-1;i++)for(let j=i+1;j<ord.length;j++){
      const a=ord[i-1],b=ord[i],c=ord[j],d=ord[j+1];
      const before=km(a,b)+(d?km(c,d):0),after=km(a,c)+(d?km(b,d):0);
      if(after<before-0.01){ord.splice(i,j-i+1,...ord.slice(i,j+1).reverse());improved=true}
    }}
  trip=ord.map(placeKey);tripChanged();
}
function tripLink(){return location.origin+location.pathname+'#trip='+trip.map(encodeURIComponent).join('~')}
async function shareTrip(){
  const url=tripLink();
  try{
    if(navigator.share&&isMobile()){await navigator.share({title:'My BharatYatra trip',url});return}
    await navigator.clipboard.writeText(url);alert('Trip link copied — anyone with it will see the same itinerary.');
  }catch(e){if(e&&e.name==='AbortError')return;prompt('Copy your trip link:',url)}
}
function emailTrip(){
  const st=tripStops();if(!st.length)return;
  const lines=st.map((p,i)=>`${i+1}. ${p.name} (${p.state}) — ${CATS[p.cat]?.label||p.cat}`+(i?`  [${legText(st[i-1],p,true)} from previous]`:''));
  const T=tripTotals(st);
  const tot=[T.road?`${fmtKm(T.road)} by road (~${fmtMin(T.min)} driving)`:'',T.straight?`${fmtKm(T.straight)} straight-line`:''].filter(Boolean).join(' + ');
  const body=`My BharatYatra itinerary:\n\n${lines.join('\n')}\n\nTotal: ${tot||'—'}\n(Drive times are estimates.)\n\nOpen on the map: ${tripLink()}`;
  window.location.href=`mailto:?subject=${encodeURIComponent('My BharatYatra trip ('+st.length+' stops)')}&body=${encodeURIComponent(body)}`;
}
const totalKm=st=>st.reduce((s,p,i)=>i?s+km(st[i-1],p):0,0);
// Sidebar tabs: "Places" list or "My trip". On phones the tabs also open/close the drawer.
function syncTabs(){
  const t=document.body.classList.contains('trip-view');
  [['tabPlaces',!t],['tripBtn',t]].forEach(([id,on])=>{const b=document.getElementById(id);b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
}
function showView(v){
  const wantTrip=v==='trip',isTrip=document.body.classList.contains('trip-view');
  if(isMobile()){
    const open=document.body.classList.contains('list-open');
    document.body.classList.toggle('list-open',!(open&&wantTrip===isTrip));
  }
  document.body.classList.toggle('trip-view',wantTrip);
  syncTabs();renderTrip();setTimeout(()=>map.invalidateSize(),50);
}
const toggleTripView=()=>showView(document.body.classList.contains('trip-view')?'places':'trip');
function tripChanged(){
  saveTrip();renderTrip();syncCardTripBtns();
  if(location.hash.startsWith('#trip='))history.replaceState(null,'',location.pathname+location.search);
  // refresh any open popup's button
  map.eachLayer(l=>{if(l._place&&l.isPopupOpen&&l.isPopupOpen()){const p=l._place;l.getPopup().setContent(popupHTML(p,p.img||imgCache[p.wiki]||null))}});
}
/* ── Road routing (free, key-less public OSRM server) ──
   One request per leg, cached per coordinate pair, so a leg with no road (e.g. to the
   Andamans) falls back to straight-line without breaking the others. */
const OSRM='https://router.project-osrm.org/route/v1/driving/';
const ISLANDS=new Set(['AN','LD']);
const routeCache={};   // key -> {ok:true,km,min,coords} | {ok:false}
let routeTimer=null,routeBusy=false;
const legKey=(a,b)=>`${a.lng.toFixed(5)},${a.lat.toFixed(5)};${b.lng.toFixed(5)},${b.lat.toFixed(5)}`;
function legInfo(a,b){
  if(a.stateCode!==b.stateCode&&(ISLANDS.has(a.stateCode)||ISLANDS.has(b.stateCode)))return {ok:false,sea:true};
  return routeCache[legKey(a,b)]||null; // null = not fetched yet
}
async function fetchLeg(a,b){
  const k=legKey(a,b);
  try{
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(OSRM+k+'?overview=full&geometries=geojson&alternatives=false&steps=false',{signal:ctl.signal});
    clearTimeout(t);
    if(r.status===429)return false; // rate-limited: retry later
    const j=await r.json();
    const rt=j.code==='Ok'&&j.routes&&j.routes[0];
    // Reject routes whose endpoints had to snap far from the place (no nearby road)
    const snapOk=rt&&j.waypoints.every(w=>w.distance<8000);
    if(snapOk&&!window._osrmAttr){map.attributionControl.addAttribution('Routes &copy; <a href="https://project-osrm.org">OSRM</a>, OpenStreetMap');window._osrmAttr=1}
    routeCache[k]=snapOk?{ok:true,km:rt.distance/1000,min:rt.duration/60,coords:rt.geometry.coordinates.map(c=>[c[1],c[0]])}:{ok:false};
  }catch(e){if(e.name==='AbortError')routeCache[k]={ok:false};else return false}
  return true;
}
// Debounced: fetch every uncached leg of the current trip (2 at a time), then re-render once.
function scheduleRouting(){
  clearTimeout(routeTimer);
  routeTimer=setTimeout(async()=>{
    if(routeBusy)return scheduleRouting();
    const st=tripStops(),todo=[];
    for(let i=1;i<st.length;i++)if(legInfo(st[i-1],st[i])===null&&!todo.some(([a,b])=>legKey(a,b)===legKey(st[i-1],st[i])))todo.push([st[i-1],st[i]]);
    if(!todo.length)return;
    routeBusy=true;let retry=false;
    try{
      while(todo.length){const batch=todo.splice(0,2);const res=await Promise.all(batch.map(([a,b])=>fetchLeg(a,b)));if(res.includes(false)){retry=true;break}}
    }finally{routeBusy=false}
    renderTrip();
    if(retry)setTimeout(scheduleRouting,4000);
  },400);
}
const fmtMin=m=>{m=Math.round(m/5)*5||5;const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?' '+r+' min':''}`:`${r} min`};
function tripTotals(st){
  let road=0,min=0,straight=0,pending=0,fallback=0;
  for(let i=1;i<st.length;i++){
    const L1=legInfo(st[i-1],st[i]);
    if(L1&&L1.ok){road+=L1.km;min+=L1.min}
    else{straight+=km(st[i-1],st[i]);if(L1)fallback++;else pending++}
  }
  return {road,min,straight,pending,fallback};
}
function legText(a,b,plain){
  const L1=legInfo(a,b);
  if(L1&&L1.ok)return `${fmtKm(L1.km)} by road · ~${fmtMin(L1.min)}`;
  const d=fmtKm(km(a,b));
  if(!L1)return plain?`${d} straight-line`:`${d} straight-line · finding road route…`;
  return L1.sea?`${d} straight-line · by sea/air`:`${d} straight-line · no road route found`;
}
function renderTrip(){
  const st=tripStops();
  document.getElementById('tripCount').textContent=st.length;
  // map route
  tripLayer.clearLayers();
  for(let i=1;i<st.length;i++){
    const a=st[i-1],b=st[i],L1=legInfo(a,b);
    if(L1&&L1.ok){
      L.polyline(L1.coords,{color:'#fff',weight:7,opacity:0.85,interactive:false}).addTo(tripLayer);
      L.polyline(L1.coords,{color:'#B5452A',weight:4,opacity:0.95,interactive:false}).addTo(tripLayer);
    }else L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:'#2C1810',weight:2.5,opacity:0.75,dashArray:'6 6',interactive:false}).addTo(tripLayer);
  }
  if(st.length>1)scheduleRouting();
  st.forEach((p,i)=>{
    const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="route-num">${i+1}</div>`,iconSize:[20,20],iconAnchor:[10,24]}),zIndexOffset:1000,title:`${i+1}. ${p.name}`});
    m.on('click',()=>focusPlace(p));m.addTo(tripLayer);
  });
  // sidebar panel: summary card + vertical timeline of stops and legs
  const el=document.getElementById('tripPanel');
  if(!st.length){el.innerHTML=`<div class="trip-empty"><svg viewBox="0 0 120 64" fill="none"><path d="M14 50C34 50 30 18 58 22s30 26 50 10" stroke="#B5452A" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/><circle cx="14" cy="50" r="7" fill="#1A7A6D" stroke="#fff" stroke-width="2.5"/><circle cx="58" cy="22" r="7" fill="#8B6914" stroke="#fff" stroke-width="2.5"/><circle cx="108" cy="32" r="7" fill="#C4563A" stroke="#fff" stroke-width="2.5"/></svg><h3>Plan your yatra</h3>Tap any pin, or the <b>+</b> on a place card, to add it to your trip. Stops are numbered on the map, joined by road, and saved on this device — then reorder, find the shortest order, and share or email the plan.</div>`;return}
  let h='';
  const T=tripTotals(st);
  let stats=`<div><b>${st.length}</b><span>stop${st.length>1?'s':''}</span></div>`;
  if(st.length>1){
    if(T.road)stats+=`<div><b>${fmtKm(T.road)}</b><span>by road</span></div><div><b>~${fmtMin(T.min)}</b><span>driving</span></div>`;
    if(T.straight)stats+=`<div><b>${fmtKm(T.straight)}</b><span>straight-line</span></div>`;
  }
  const note=st.length<2?'Add another stop to see road distance and drive time.'
    :T.pending?'Finding road routes…'
    :'Road distances and drive times are estimates from OpenStreetMap (OSRM) and exclude stops and traffic.'+(T.fallback?' Legs without a road route (e.g. to islands) use straight-line distance.':'');
  const shortNote=st.length<2||T.pending?note:'Road km and drive times are estimates (OSRM)'+(T.fallback?'; island legs are straight-line.':'.');
  h+=`<div class="trip-hero"><div class="th-title">Your trip</div><div class="th-stats">${stats}</div><small><span class="n-long">${note}</span><span class="n-short">${shortNote}</span></small></div><ol class="tl">`;
  st.forEach((p,i)=>{
    const c=CATS[p.cat]||CATS.scenic;
    if(i){
      const L1=legInfo(st[i-1],p),kind=L1&&L1.ok?'road':!L1?'pending':L1.sea?'sea':'none';
      h+=`<li class="tl-leg ${kind}" aria-label="Leg ${i}"><span class="leg-chip">${LEG_ICONS[kind]}<span>${legText(st[i-1],p)}</span></span></li>`;
    }
    h+=`<li class="tl-stop" style="--c:${c.color};animation-delay:${Math.min(i,10)*25}ms"><span class="tl-num" title="Drag to reorder">${i+1}</span><div class="trip-info" data-i="${i}" title="Show on map"><h3>${esc(p.name)}</h3><div><span>${c.label}</span> · ${esc(p.state)}</div></div><div class="trip-ctl"><button class="grip" data-i="${i}" aria-label="Reorder ${esc(p.name)}: drag, or use arrow keys" title="Drag to reorder">${GRIP_SVG}</button><button class="mv" onclick="moveStop(${i},-1)" ${i?'':'disabled'} aria-label="Move ${esc(p.name)} up" title="Move up">↑</button><button class="mv" onclick="moveStop(${i},1)" ${i<st.length-1?'':'disabled'} aria-label="Move ${esc(p.name)} down" title="Move down">↓</button><button class="rm" onclick="removeStop(${i})" aria-label="Remove ${esc(p.name)}" title="Remove">✕</button></div></li>`;
  });
  h+='</ol>';
  h+=`<div class="trip-actions"><button class="primary" onclick="shareTrip()">${ACT_ICONS.share}Share trip link</button>${st.length>2?`<button onclick="optimiseTrip()" title="Keeps your first stop, reorders the rest">${ACT_ICONS.opt}Shortest order</button>`:''}<button onclick="fitTrip()">${ACT_ICONS.map}Show on map</button><button onclick="emailTrip()">${ACT_ICONS.mail}Email</button><button class="ghost" onclick="clearTrip()">Clear trip</button></div>`;
  el.innerHTML=h;
  el.querySelectorAll('.trip-info').forEach(d=>d.onclick=()=>focusPlace(st[+d.dataset.i]));
  el.querySelectorAll('.tl-stop').forEach((li,i)=>{
    li.querySelectorAll('.tl-num,.grip').forEach(hd=>hd.addEventListener('pointerdown',e=>startStopDrag(e,li,i)));
    li.querySelector('.grip').addEventListener('keydown',e=>{
      const d=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;if(!d)return;
      e.preventDefault();const j=i+d;if(j<0||j>=trip.length)return;
      moveStop(i,d);const g=document.querySelectorAll('#tripPanel .grip')[j];if(g)g.focus();
    });
  });
  if(lastDropped!=null){const li=el.querySelectorAll('.tl-stop')[lastDropped];if(li)li.classList.add('dropped');lastDropped=null}
}
const GRIP_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
/* ── Drag to reorder trip stops (mouse + touch via pointer events) ──
   The dragged stop follows the pointer; the other stops slide to make room. */
let lastDropped=null;
function startStopDrag(e,li,from){
  if(e.button>0||trip.length<2)return;
  e.preventDefault();
  const panel=document.getElementById('tripPanel');
  const stops=[...panel.querySelectorAll('.tl-stop')];
  const tops=stops.map(s=>s.getBoundingClientRect().top+panel.scrollTop);
  const y0=e.clientY,st0=panel.scrollTop;
  let to=from,moved=false,scrollV=0,raf=0,lastY=y0;
  const hd=e.currentTarget;try{hd.setPointerCapture(e.pointerId)}catch(_){}
  function layout(){
    const dy=lastY-y0+(panel.scrollTop-st0);
    li.style.transform=`translateY(${dy}px)`;
    const mid=tops[from]+dy+li.offsetHeight/2;
    to=0;tops.forEach((t,k)=>{if(k!==from&&mid>t+stops[k].offsetHeight/2)to++});
    const step=tops[from+1]!==undefined?tops[from+1]-tops[from]:(from?tops[from]-tops[from-1]:0);
    stops.forEach((s,k)=>{if(k===from)return;
      const sh=(from<to&&k>from&&k<=to)?-step:(from>to&&k<from&&k>=to)?step:0;
      s.style.transform=sh?`translateY(${sh}px)`:''});
  }
  function tick(){if(scrollV){panel.scrollTop+=scrollV;layout()}raf=requestAnimationFrame(tick)}
  function move(ev){
    lastY=ev.clientY;
    if(!moved){if(Math.abs(lastY-y0)<4)return;moved=true;li.classList.add('dragging');document.body.classList.add('tl-dragging');stops.forEach(s=>s!==li&&s.classList.add('shift'));raf=requestAnimationFrame(tick)}
    const r=panel.getBoundingClientRect();
    scrollV=lastY<r.top+30?-8:lastY>r.bottom-30?8:0;
    layout();
  }
  function end(){
    hd.removeEventListener('pointermove',move);hd.removeEventListener('pointerup',end);hd.removeEventListener('pointercancel',end);
    cancelAnimationFrame(raf);document.body.classList.remove('tl-dragging');
    stops.forEach(s=>{s.style.transform='';s.classList.remove('shift','dragging')});
    if(moved&&to!==from){const [k]=trip.splice(from,1);trip.splice(to,0,k);lastDropped=to;tripChanged()}
    else if(!moved&&hd.classList.contains('tl-num'))focusPlace(tripStops()[from]);
  }
  hd.addEventListener('pointermove',move);hd.addEventListener('pointerup',end);hd.addEventListener('pointercancel',end);
}
const svgI=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const LEG_ICONS={
  road:svgI('<path d="M5 17h14v-5l-2-5H7l-2 5v5z"/><path d="M5 12h14"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/>'),
  sea:svgI('<path d="M2 16l20-6-6 9-3-3-4 2 1-4z"/>'),
  none:svgI('<path d="M4 20L20 4"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/>'),
  pending:svgI('<path d="M12 3a9 9 0 109 9"/>')};
const ACT_ICONS={
  share:svgI('<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.9l7.6-4.3M8.2 13.1l7.6 4.3"/>'),
  opt:svgI('<path d="M4 6h10M4 12h7M4 18h4"/><path d="M17 4v16M14 17l3 3 3-3"/>'),
  map:svgI('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>'),
  mail:svgI('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>')};
function fitTrip(){
  const st=tripStops();if(!st.length)return;
  if(isMobile())document.body.classList.remove('list-open');
  setTimeout(()=>{map.invalidateSize();st.length===1?map.setView([st[0].lat,st[0].lng],10):map.fitBounds(st.map(p=>[p.lat,p.lng]),{padding:[40,40],maxZoom:10})},60);
}
// Popup "+ Add to trip" buttons (popups are re-created, so delegate)
document.getElementById('map').addEventListener('click',e=>{
  const b=e.target.closest('.pop-trip');if(!b)return;
  e.preventDefault();e.stopPropagation();toggleTrip(decodeURIComponent(b.dataset.trip));
},true); // capture: Leaflet stops click propagation out of popups
async function initTrip(){
  const clean=keys=>Array.isArray(keys)?[...new Set(keys.filter(k=>typeof k==='string'))].slice(0,60):[];
  // Stops can be non-highlight places, so load their states before resolving them
  async function resolve(keys){
    const states=[...new Set(keys.map(k=>k.split('|')[0]))].filter(sc=>statesIndex[sc]&&!loadedStates[sc]);
    if(states.length){await Promise.all(states.map(loadStateData));render()}
    return keys.filter(k=>findPlace(k));
  }
  const m=location.hash.match(/^#trip=(.*)$/);
  if(m){
    trip=await resolve(clean(m[1].split('~').map(k=>{try{return decodeURIComponent(k)}catch(e){return ''}}).filter(Boolean)));
    if(trip.length){saveTrip();document.body.classList.add('trip-view');syncTabs();if(isMobile())document.body.classList.add('list-open');fitTrip();renderTrip();return}
  }
  let saved=[];try{saved=JSON.parse(localStorage.getItem(TRIP_LS)||'[]')}catch(e){}
  trip=await resolve(clean(saved));
  renderTrip();
}

init().then(initTrip);
</script>
