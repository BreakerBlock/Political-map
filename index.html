<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BharatYatra — India Travel Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --parchment:#F5EDE0;--surface:#FFFDF8;--surface-hover:#F0E8DA;
  --border:#D9CEBA;--border-light:#E8DFCF;
  --ink:#2C1810;--ink-dim:#7A6B5D;--ink-light:#A89882;
  --accent:#B5452A;--accent-hover:#973A22;
}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-flag{width:36px;height:36px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border);flex-shrink:0}
.brand-flag span:nth-child(1){flex:1;background:#FF9933}
.brand-flag span:nth-child(2){flex:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000080;line-height:1}
.brand-flag span:nth-child(3){flex:1;background:#138808}
header h1{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700}
header h1 span{color:var(--accent)}
.header-sub{font-size:0.58rem;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-dim)}
.btn-suggest{padding:8px 18px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;font-size:0.75rem;font-weight:600;transition:background 0.15s;display:flex;align-items:center;gap:7px;text-decoration:none}
.btn-suggest:hover{background:var(--accent-hover)}

.main-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:340px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

/* ── Filters panel ── */
.filters{padding:12px 14px 10px;border-bottom:1px solid var(--border-light)}
.filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.filters-head h2{font-family:'Cormorant Garamond',serif;font-size:0.85rem;font-weight:700;color:var(--ink-dim)}
.cat-toggle{border:none;background:none;display:flex;align-items:center;gap:6px;cursor:default;font-family:inherit;padding:0;color:inherit}
.chev{display:none;transition:transform 0.2s;color:var(--ink-dim);flex-shrink:0}
.pc-chev{margin-left:auto}
.toggle-all{font-size:0.62rem;color:var(--accent);cursor:pointer;font-weight:600;border:none;background:none;font-family:inherit}
.toggle-all:hover{text-decoration:underline}

.cat-list{display:flex;flex-wrap:wrap;gap:5px}
.cat-btn{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:20px;border:1.5px solid var(--border-light);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit;font-size:0.72rem;transition:all 0.12s;white-space:nowrap}
.cat-btn:hover{background:var(--surface-hover)}
.cat-btn.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:var(--c);font-weight:600}
.cat-swatch{width:18px;height:18px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cat-swatch svg{width:11px;height:11px}
.cat-cnt{font-size:0.6rem;color:var(--ink-light);font-weight:600}
.filter-row{display:contents}
.cat-summary,.cat-panel-head,.cat-check{display:none}

/* ── State filter ── */
.state-filter{padding:8px 14px;border-bottom:1px solid var(--border-light);display:flex;gap:8px;align-items:center}
.state-filter label{font-size:0.68rem;color:var(--ink-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap}
.state-filter select{flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--parchment);color:var(--ink);font-family:inherit;font-size:0.78rem;outline:none;cursor:pointer}
.state-filter select:focus{border-color:var(--accent)}

/* ── Search ── */
.search-wrap{padding:8px 14px;border-bottom:1px solid var(--border-light);position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border-radius:8px;border:1px solid var(--border);background:var(--parchment);color:var(--ink);font-family:inherit;font-size:0.8rem;outline:none}
.search-wrap input::placeholder{color:var(--ink-light)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,69,42,0.08)}
.s-icon{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink-light);fill:none;stroke-width:2}

.place-count{padding:6px 14px;font-size:0.66rem;color:var(--ink-light);border-bottom:1px solid var(--border-light);display:flex;align-items:center;cursor:default}
.place-count .total-badge{margin-left:auto;font-size:0.58rem;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-weight:600}

/* ── Place list ── */
.place-list{flex:1;overflow-y:auto;padding:4px 8px}
.place-list::-webkit-scrollbar{width:4px}
.place-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.place-card{padding:9px 11px;border-radius:8px;cursor:pointer;transition:background 0.1s;display:flex;align-items:flex-start;gap:9px}
.place-card+.place-card{border-top:1px solid var(--border-light)}
.place-card:hover{background:var(--surface-hover)}
.pc-swatch{width:20px;height:20px;border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.pc-swatch svg{width:11px;height:11px}
.place-card h3{font-size:0.78rem;font-weight:600}
.pc-state{font-size:0.62rem;color:var(--ink-light);margin-top:1px}
.place-card p{font-size:0.66rem;color:var(--ink-dim);margin-top:2px;line-height:1.3}

/* ── Map ── */
#map{flex:1;background:#AECBCE;position:relative}
.tile-relief{filter:sepia(0.42) saturate(0.95) hue-rotate(-6deg) brightness(1.05) contrast(1.04)}
.tile-warm{filter:sepia(0.25) saturate(1.02) hue-rotate(-4deg) brightness(1.03)}
.map-vignette{position:absolute;inset:0;pointer-events:none;z-index:350;box-shadow:inset 0 0 90px 20px rgba(72,48,24,0.22),inset 0 0 25px rgba(72,48,24,0.12)}
.compass{position:absolute;left:12px;bottom:26px;z-index:800;width:54px;height:54px;opacity:0.5;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(255,253,248,0.8))}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--border)!important;font-size:16px!important;width:32px!important;height:32px!important;line-height:32px!important}

/* ── Cluster styling ── */
.marker-cluster{background:transparent!important}
.marker-cluster div{
  width:36px!important;height:36px!important;margin-left:0!important;margin-top:0!important;
  border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;
  font-family:'DM Sans',sans-serif!important;font-weight:700!important;font-size:12px!important;
  box-shadow:0 2px 8px rgba(44,24,16,0.3)!important;border:2px solid #fff!important;
}
.marker-cluster-small div{background:#4A9E7E!important;color:#fff!important}
.marker-cluster-medium div{background:#D08B38!important;color:#fff!important}
.marker-cluster-large div{background:var(--accent)!important;color:#fff!important}

/* ── Popup ── */
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--ink)!important;border-radius:12px!important;box-shadow:0 6px 24px rgba(44,24,16,0.18)!important;border:1px solid var(--border)!important;overflow:hidden!important;padding:0!important}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-content{font-family:'DM Sans',sans-serif!important;font-size:13px!important;line-height:1.5!important;margin:0!important;width:250px!important}
.pop-img-wrap{width:250px;height:140px;overflow:hidden;background:var(--parchment);display:none}
.pop-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.pop-body{padding:12px 15px 14px}
.pop-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px;line-height:1.2}
.pop-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pop-cat{font-size:10px;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.1em;margin-top:3px}
.pop-state{font-size:12px;color:var(--ink-dim);margin-top:5px}
.pop-desc{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.45}
.leaflet-popup-close-button{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,0.5);top:6px!important;right:6px!important;font-size:18px!important;z-index:10}

.pin-label{
  background:rgba(255,253,248,0.92)!important;border:1px solid var(--border)!important;
  border-radius:5px!important;box-shadow:0 1px 4px rgba(44,24,16,0.15)!important;
  color:var(--ink)!important;font-family:'DM Sans',sans-serif!important;
  font-size:10px!important;font-weight:600!important;padding:2px 6px!important;white-space:nowrap!important;
}
.pin-label::before{display:none!important}
.leaflet-tooltip.pin-label{display:none}
body.show-pin-labels .leaflet-tooltip.pin-label{display:block}

.state-label{font-family:'DM Sans',sans-serif!important;font-size:9.5px!important;font-weight:600!important;color:rgba(44,24,16,0.38)!important;letter-spacing:0.07em!important;text-transform:uppercase!important;white-space:nowrap!important;text-shadow:0 0 5px rgba(245,237,224,1)!important;pointer-events:none!important;text-align:center!important}
.city-label{font-family:'DM Sans',sans-serif!important;pointer-events:none!important;white-space:nowrap!important}
.cl-inner{display:flex;align-items:center;gap:4px}
.cl-dot{width:5px;height:5px;border-radius:50%;background:#5A4A3A;border:1px solid #fff;box-shadow:0 0 2px rgba(0,0,0,0.4);flex-shrink:0}
.cl-name{font-size:10px;font-weight:500;color:#4A3A2C;text-shadow:0 0 3px #fff,0 0 5px #fff,0 0 6px #fff}
.city-label.tier1 .cl-name{font-weight:600;font-size:10.5px}

.disclaimer{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:800;font-size:0.56rem;color:var(--ink-light);background:rgba(255,253,248,0.92);padding:3px 12px;border-radius:4px;white-space:nowrap}
.loading-overlay{position:absolute;inset:0;z-index:900;background:rgba(245,237,224,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--ink-dim);gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Trip planner ── */
.trip-btn{margin-left:10px;display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:12px;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-family:inherit;font-size:0.62rem;font-weight:700;cursor:pointer}
.trip-btn b{background:var(--accent);color:#fff;border-radius:8px;padding:0 6px;font-size:0.58rem}
body.trip-view .trip-btn{background:var(--accent);color:#fff}
body.trip-view .trip-btn b{background:#fff;color:var(--accent)}
.trip-panel{display:none;flex:1;overflow-y:auto;padding:8px 10px}
body.trip-view .trip-panel{display:block}
body.trip-view .place-list{display:none!important}
.trip-empty{font-size:0.74rem;color:var(--ink-dim);line-height:1.5;padding:10px 4px}
.trip-stop{display:flex;align-items:center;gap:8px;padding:7px 4px}
.trip-leg{font-size:0.6rem;color:var(--ink-light);padding:0 0 0 34px;margin:-2px 0}
.trip-num{width:24px;height:24px;border-radius:50%;color:#fff;font-size:0.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:2px solid #fff;box-shadow:0 1px 3px rgba(44,24,16,0.3)}
.trip-info{flex:1;min-width:0;cursor:pointer}
.trip-info h3{font-size:0.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trip-info div{font-size:0.6rem;color:var(--ink-light)}
.trip-ctl{display:flex;gap:2px}
.trip-ctl button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border-light);background:var(--surface);color:var(--ink-dim);cursor:pointer;font-size:0.75rem;line-height:1}
.trip-ctl button:hover:not(:disabled){background:var(--surface-hover);color:var(--ink)}
.trip-ctl button:disabled{opacity:0.35;cursor:default}
.trip-sum{font-size:0.7rem;color:var(--ink-dim);padding:8px 4px;border-top:1px solid var(--border-light);margin-top:4px}
.trip-sum small{display:block;font-size:0.58rem;color:var(--ink-light);margin-top:2px}
.trip-actions{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 10px}
.trip-actions button{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-family:inherit;font-size:0.68rem;font-weight:600;cursor:pointer}
.trip-actions button:hover{background:var(--surface-hover)}
.trip-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.pop-trip{margin-top:9px;width:100%;padding:7px 10px;border-radius:7px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.pop-trip.in{background:var(--surface);color:var(--accent)}
.route-num{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font:700 11px 'DM Sans',sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(44,24,16,0.45)}

button,a,.place-card,.cat-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

@media(max-width:760px){
  body{height:100dvh}
  .main-wrap{flex-direction:column}
  .sidebar{width:100%;flex-shrink:0;border-right:none;border-bottom:1px solid var(--border)}
  header{padding:8px 14px}
  header h1{font-size:1.15rem}
  .header-sub{display:none}
  .brand-flag{width:30px;height:30px}
  .btn-suggest{padding:7px 12px;font-size:0.7rem}
  /* Compact control row: [Categories ▾] [State select]. Categories open as a dropdown
     that overlays the map, so the map never resizes or jumps when filters change. */
  .sidebar{overflow:visible;position:relative;z-index:1100}
  .filter-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border-light);position:relative}
  .filters{padding:0;border:none;flex-shrink:0}
  .filters-head{margin:0}
  .filters-head .toggle-all{display:none}
  .cat-toggle{cursor:pointer;height:40px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--parchment);gap:7px}
  .filters.open .cat-toggle{border-color:var(--accent)}
  .cat-toggle h2{font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:600;color:var(--ink)}
  .cat-summary{display:inline-block;font-size:0.64rem;font-weight:700;background:var(--accent);color:#fff;border-radius:9px;padding:1px 7px;line-height:1.5}
  .chev{display:block}
  .filters.open .cat-toggle .chev{transform:rotate(180deg)}
  .cat-panel{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(44,24,16,0.28);padding:10px 12px 12px;z-index:1200;max-height:62vh;overflow-y:auto;overscroll-behavior:contain}
  .filters.open .cat-panel{display:block}
  .cat-panel-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;font-size:0.66rem;color:var(--ink-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.07em}
  .cat-panel-head span{flex:1}
  .cat-panel-head .toggle-all{font-size:0.78rem;text-transform:none;letter-spacing:0;padding:6px 2px}
  .cat-done{border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:0.76rem;font-weight:600;border-radius:7px;padding:6px 14px;cursor:pointer;text-transform:none;letter-spacing:0}
  .cat-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cat-btn{border-radius:9px;padding:8px 10px;min-height:44px;font-size:0.8rem;white-space:normal;text-align:left}
  .cat-btn span:nth-child(2){flex:1;min-width:0}
  .cat-check{display:flex;width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);background:var(--surface);flex-shrink:0;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;line-height:1}
  .cat-btn.active .cat-check{background:var(--c);border-color:var(--c)}
  .cat-btn.active .cat-check::after{content:'✓'}
  .state-filter{flex:1;min-width:0;padding:0;border:none}
  .state-filter label{display:none}
  .state-filter select{height:40px;width:100%;min-width:0}
  .search-wrap input,.state-filter select{font-size:16px}
  header,.sidebar{touch-action:pan-x pan-y}
  .trip-panel{display:none!important;max-height:34vh}
  body.list-open.trip-view .trip-panel{display:block!important}
  .place-count{cursor:pointer;user-select:none}
  .place-list{display:none;max-height:28vh}
  body.list-open .place-list{display:block;overflow-y:auto}
  body.list-open .pc-chev{transform:rotate(180deg)}
  .leaflet-control-zoom a{width:38px!important;height:38px!important;line-height:38px!important}
  .disclaimer{font-size:0.5rem;top:6px;right:6px;bottom:auto;left:auto;transform:none}
  .compass{width:42px;height:42px;left:8px;bottom:20px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-flag"><span></span><span>☸</span><span></span></div>
    <div><h1>Bharat<span>Yatra</span></h1><div class="header-sub">Interactive India Travel Planner</div></div>
  </div>
  <a class="btn-suggest" href="#" onclick="return suggestPlace()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 3.5l6 4 6-4M1 3.5v7a1 1 0 001 1h10a1 1 0 001-1v-7M1 3.5a1 1 0 011-1h10a1 1 0 011 1"/></svg>
    Suggest a Place
  </a>
</header>
<div class="main-wrap">
  <aside class="sidebar">
    <div class="filter-row">
    <div class="filters" id="filters">
      <div class="filters-head">
        <button class="cat-toggle" id="catToggle" onclick="toggleCatPanel(event)" aria-expanded="false" aria-controls="catPanel">
          <h2>Categories</h2>
          <span class="cat-summary" id="catSummary"></span>
          <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg>
        </button>
        <button class="toggle-all" id="toggleAll" onclick="toggleAllCats()">Clear</button>
      </div>
      <div class="cat-panel" id="catPanel">
        <div class="cat-panel-head"><span>Show on map</span><button class="toggle-all" id="toggleAllM" onclick="toggleAllCats()">Clear</button><button class="cat-done" onclick="closeCatPanel()">Done</button></div>
        <div class="cat-list" id="catBtns" role="group" aria-label="Categories"></div>
      </div>
    </div>
    <div class="state-filter">
      <label for="stateSelect">State</label>
      <select id="stateSelect" onchange="onStateSelect(this.value)" aria-label="State"><option value="">All India</option></select>
    </div>
    </div>
    <div class="search-wrap">
      <svg class="s-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
      <input type="text" id="searchInput" placeholder="Search places, states…" oninput="render()">
    </div>
    <div class="place-count" id="placeCount" onclick="togglePlaceList()">
      <span id="placeCountText"></span>
      <button class="trip-btn" id="tripBtn" onclick="event.stopPropagation();toggleTripView()" title="Your trip itinerary">Trip <b id="tripCount">0</b></button>
      <span class="total-badge" id="totalBadge"></span>
      <svg class="chev pc-chev" width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg>
    </div>
    <div class="place-list" id="placeList"></div>
    <div class="trip-panel" id="tripPanel"></div>
  </aside>
  <div id="map">
    <div class="loading-overlay" id="loader"><div class="spinner"></div>Loading places…</div>
    <div class="map-vignette"></div>

<script>
const CONTACT_EMAIL='utkarsh.khurana@outlook.com';
const DATA_BASE='';

};
const CATS={scenic:{label:'Scenic',color:'#1A7A6D'},religious:{label:'Spiritual',color:'#C4563A'},fauna:{label:'Wildlife',color:'#3D7A35'},history:{label:'Heritage',color:'#8B6914'},arts:{label:'Arts & Crafts',color:'#8B3FA0'},cuisine:{label:'Cuisine',color:'#D06B25'},adventure:{label:'Adventure',color:'#2260BD'},festivals:{label:'Festivals',color:'#C73E6B'}};
const activeCats=new Set(Object.keys(CATS));

/* ── State ── */
let statesIndex={};
let allPlaces=[];        // currently loaded (highlights + expanded states)
let loadedStates={};     // {SC: [places]}
let highlightPlaces=[];
let selectedState='';
let totalPlaces=0;
const imgCache={};

/* ── City and state labels ── */
const STATE_LABELS=[["J&K",33.6,74.9],["LADAKH",34.4,77.6],["HIMACHAL",31.9,77.3],["PUNJAB",30.9,75.4],["HARYANA",29.2,76.1],["UTTARAKHAND",30.1,79.2],["RAJASTHAN",26.6,73.0],["UTTAR PRADESH",27.0,80.5],["BIHAR",25.7,85.6],["GUJARAT",22.6,71.6],["MADHYA PRADESH",23.4,78.6],["CHHATTISGARH",21.5,82.0],["JHARKHAND",23.6,85.5],["WEST BENGAL",24.0,87.9],["ODISHA",20.4,84.6],["MAHARASHTRA",19.3,76.2],["TELANGANA",17.9,79.1],["ANDHRA PRADESH",15.7,79.9],["KARNATAKA",14.8,76.1],["GOA",15.35,74.05],["KERALA",10.4,76.4],["TAMIL NADU",11.0,78.5],["ASSAM",26.3,92.9],["MEGHALAYA",25.5,91.2],["ARUNACHAL",28.1,94.6],["NAGALAND",26.1,94.4],["MANIPUR",24.7,93.9],["MIZORAM",23.3,92.9],["TRIPURA",23.8,91.7],["SIKKIM",27.6,88.5],["DELHI",28.65,77.1]];
const CITIES_T1=[["New Delhi",28.61,77.21],["Mumbai",19.08,72.88],["Kolkata",22.57,88.36],["Chennai",13.08,80.27],["Bengaluru",12.97,77.59],["Hyderabad",17.39,78.49],["Ahmedabad",23.02,72.57],["Pune",18.52,73.86],["Jaipur",26.92,75.79],["Lucknow",26.85,80.95],["Srinagar",34.08,74.80],["Leh",34.15,77.58],["Chandigarh",30.73,76.78],["Bhopal",23.26,77.41],["Patna",25.59,85.14],["Guwahati",26.14,91.74],["Kochi",9.93,76.27],["Panaji",15.49,73.83],["Varanasi",25.32,83.01],["Amritsar",31.63,74.87],["Indore",22.72,75.86]];
const CITIES_T2=[["Shimla",31.10,77.17],["Dehradun",30.32,78.03],["Jammu",32.73,74.86],["Ranchi",23.34,85.31],["Raipur",21.25,81.63],["Bhubaneswar",20.30,85.82],["Thiruvananthapuram",8.52,76.94],["Madurai",9.93,78.12],["Coimbatore",11.02,76.96],["Mysuru",12.30,76.64],["Mangaluru",12.91,74.86],["Surat",21.17,72.83],["Vadodara",22.31,73.19],["Jodhpur",26.24,73.02],["Udaipur",24.58,73.68],["Agra",27.18,78.02],["Prayagraj",25.44,81.85],["Nashik",20.00,73.79],["Visakhapatnam",17.69,83.22],["Nagpur",21.15,79.09],["Imphal",24.82,93.94],["Shillong",25.57,91.88],["Gangtok",27.33,88.62],["Siliguri",26.73,88.40],["Dharamshala",32.22,76.32],["Rishikesh",30.09,78.27],["Port Blair",11.62,92.73]];

/* ══════ MAP ══════ */
// Full extent of India's official boundary, incl. all of J&K and Ladakh (Gilgit-Baltistan, Aksai Chin)
const INDIA_BOUNDS=[[6.5,68.1],[37.1,97.4]];
const map=L.map('map',{zoomControl:true,minZoom:4,zoomSnap:0.25,maxBounds:[[3,60],[40,102]],maxBoundsViscosity:0.85});
// Fit the whole country into whatever space the map has (phones used to open on a zoom-5 view that cut off Kashmir and the south)
function showAllIndia(animate){map.fitBounds(INDIA_BOUNDS,{padding:[8,8],animate:!!animate})}
showAllIndia();
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:8,className:'tile-relief'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{attribution:'CARTO OSM',minZoom:9,maxZoom:18,subdomains:'abcd',className:'tile-warm'}).addTo(map);
L.control.scale({imperial:false,position:'bottomright'}).addTo(map);

const clusters=L.markerClusterGroup({maxClusterRadius:45,spiderfyOnMaxZoom:true,showCoverageOnHover:false,zoomToBoundsOnClick:true,disableClusteringAtZoom:12});
map.addLayer(clusters);

// Label layers
function mkLabel(text,lat,lng,cls){return L.marker([lat,lng],{icon:L.divIcon({className:cls,html:cls==='state-label'?text:`<div class="cl-inner"><span class="cl-dot"></span><span class="cl-name">${text}</span></div>`,iconSize:cls==='state-label'?[120,14]:[110,14],iconAnchor:cls==='state-label'?[60,7]:[3,7]}),interactive:false})}
const stateLayer=L.layerGroup(STATE_LABELS.map(s=>mkLabel(s[0],s[1],s[2],'state-label'))).addTo(map);
const cityT1=L.layerGroup(CITIES_T1.map(c=>mkLabel(c[0],c[1],c[2],'city-label tier1')));
const cityT2=L.layerGroup(CITIES_T2.map(c=>mkLabel(c[0],c[1],c[2],'city-label tier2')));

function syncLabels(){
  const z=map.getZoom();
  [stateLayer,cityT1,cityT2].forEach(l=>{if(map.hasLayer(l))map.removeLayer(l)});
  if(z<8)map.addLayer(stateLayer);
  if(z>=4.5)map.addLayer(cityT1);
  if(z>=7)map.addLayer(cityT2);
  document.body.classList.toggle('show-pin-labels',z>=9);
}
map.on('zoomend',syncLabels);syncLabels();

/* ── Boundary ── */
async function loadBoundary(){
  try{
    const r=await fetch('india-boundary.geojson');if(!r.ok)throw 0;
    const g=await r.json();
    const holes=g.features[0].geometry.coordinates.map(p=>p[0].map(pt=>[pt[1],pt[0]]));
    L.polygon([[ [-89,-179],[-89,179],[89,179],[89,-179] ],...holes],{stroke:false,fillColor:'#8E8471',fillOpacity:0.42,interactive:false}).addTo(map);
    L.geoJSON(g,{style:{color:'#B5452A',weight:7,opacity:0.16,fill:false},interactive:false}).addTo(map);
    L.geoJSON(g,{style:{color:'#6E3D1B',weight:2.2,opacity:0.9,fillColor:'#FFF4DE',fillOpacity:0.14},interactive:false}).addTo(map);
  }catch(e){console.warn('Boundary:',e)}
}
loadBoundary();

/* ── Auto-load state data when zoomed into a region ── */
// Loads the nearest state plus any state whose centre falls inside the (padded) view,
// then re-renders so the newly loaded pins actually appear.
map.on('moveend',async()=>{
  if(map.getZoom()<7||selectedState)return;
  const c=map.getCenter(),view=map.getBounds().pad(0.25);
  const want=new Set();
  let best='',bestD=Infinity;
  for(const[sc,s] of Object.entries(statesIndex)){
    const d=Math.hypot(c.lat-s.lat,c.lng-s.lng);
    if(d<bestD){bestD=d;best=sc}
    if(view.contains([s.lat,s.lng]))want.add(sc);
  }
  if(best&&bestD<4)want.add(best);
  const todo=[...want].filter(sc=>!loadedStates[sc]);
  if(!todo.length)return;
  await Promise.all(todo.map(loadStateData));
  render();
});

/* ══════ DATA LOADING ══════ */
async function init(){
  try{
    const [hlRes,siRes]=await Promise.all([
      fetch(DATA_BASE+'highlights.json?v='+Date.now()),
      fetch(DATA_BASE+'states-index.json?v='+Date.now())
    ]);
    if(!hlRes.ok||!siRes.ok)throw new Error('init fetch failed');
    const hlData=await hlRes.json();
    const siData=await siRes.json();
    highlightPlaces=hlData.places;
    totalPlaces=hlData.total;
    statesIndex=siData;
    allPlaces=[...highlightPlaces];
    populateStateSelect();
  }catch(e){console.warn('Init:',e.message)}
  document.getElementById('loader').style.display='none';
  render();
}

const statePending={};
function loadStateData(sc){
  if(loadedStates[sc])return Promise.resolve(loadedStates[sc]);
  if(!statePending[sc])statePending[sc]=fetchStateData(sc).finally(()=>{delete statePending[sc]});
  return statePending[sc];
}
async function fetchStateData(sc){
  try{
    // State files live next to index.html (e.g. kl.json); fall back to the older states/ folder layout.
    const f=sc.toLowerCase()+'.json',v='?v='+Date.now();
    let r=await fetch(DATA_BASE+f+v);
    if(!r.ok)r=await fetch(DATA_BASE+'states/'+f+v);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    loadedStates[sc]=d.places;
    // Merge: replace highlights for this state with full state data
    allPlaces=allPlaces.filter(p=>p.stateCode!==sc).concat(d.places);
    return d.places;
  }catch(e){console.warn('State load:',sc,e);return []}
}

function populateStateSelect(){
  const sel=document.getElementById('stateSelect');
  sel.innerHTML='<option value="">All India</option>';
  const sorted=Object.entries(statesIndex).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  sorted.forEach(([sc,s])=>{
    const o=document.createElement('option');
    o.value=sc;o.textContent=`${s.name} (${s.count})`;
    sel.appendChild(o);
  });
}

async function onStateSelect(sc){
  selectedState=sc;
  if(sc){
    await loadStateData(sc);
    const s=statesIndex[sc];
    map.setView([s.lat,s.lng],7,{animate:true});
  }else{
    showAllIndia(true);
  }
  render();
}

/* ══════ MARKERS ══════ */
function makeIcon(cat){
  const c=CATS[cat]||CATS.scenic;
  return L.divIcon({className:'',html:`<div style="width:24px;height:24px;border-radius:50%;background:${c.color};border:2px solid #fff;box-shadow:0 1px 5px rgba(44,24,16,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.12s" onmouseover="this.style.transform='scale(1.28)'" onmouseout="this.style.transform='scale(1)'">${ICONS[cat]||ICONS.scenic}</div>`,iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-8]});
}
function popupHTML(p,img){
  const c=CATS[p.cat]||CATS.scenic;
  return `<div class="pop-img-wrap" style="${img?'display:block':''}">${img?`<img src="${img}" alt="${p.name}" onerror="this.parentElement.style.display='none'">`:''}</div><div class="pop-body"><div class="pop-name"><span class="pop-dot" style="background:${c.color}"></span>${p.name}</div><div class="pop-cat">${c.label}</div><div class="pop-state">📍 ${p.state}</div><div class="pop-desc">${p.desc}</div>${tripBtnHTML(p)}</div>`;
}
async function getImage(p){
  if(p.img)return p.img;if(!p.wiki)return null;if(imgCache[p.wiki]!==undefined)return imgCache[p.wiki];
  try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki));if(!r.ok)throw 0;const j=await r.json();const u=(j.thumbnail&&j.thumbnail.source)?j.thumbnail.source.replace(/\/\d+px-/,'/500px-'):null;imgCache[p.wiki]=u;return u}catch(e){imgCache[p.wiki]=null;return null}
}

/* ══════ RENDER ══════ */
const placeKey=p=>p.stateCode+'|'+p.name;
let markerByKey={};
function render(){
  // Remember an open popup so a re-render (e.g. after a state auto-loads) doesn't close it
  let reopen=null;
  for(const[k,m] of Object.entries(markerByKey)){if(m.isPopupOpen&&m.isPopupOpen()){reopen=k;break}}
  clusters.clearLayers();markerByKey={};
  const listEl=document.getElementById('placeList');listEl.innerHTML='';
  const q=(document.getElementById('searchInput').value||'').toLowerCase();

  let pool=selectedState?allPlaces.filter(p=>p.stateCode===selectedState):allPlaces;
  const visible=pool.filter(p=>activeCats.has(p.cat)&&(!q||p.name.toLowerCase().includes(q)||p.state.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)));
  visible.sort((a,b)=>{const d=Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat);return d||a.name.localeCompare(b.name)});

  const markers=[];
  visible.forEach(p=>{
    const c=CATS[p.cat]||CATS.scenic;
    const m=L.marker([p.lat,p.lng],{icon:makeIcon(p.cat)});
    m.bindPopup(popupHTML(p,p.img||null),{maxWidth:250,minWidth:250});
    m.bindTooltip(p.name,{permanent:true,direction:'right',offset:[12,0],className:'pin-label'});
    m.on('popupopen',async()=>{const u=await getImage(p);if(u&&m.getPopup())m.getPopup().setContent(popupHTML(p,u))});
    m._place=p;
    markers.push(m);markerByKey[placeKey(p)]=m;

    const card=document.createElement('div');
    card.className='place-card';
    card.innerHTML=`<div class="pc-swatch" style="background:${c.color}">${ICONS[p.cat]||ICONS.scenic}</div><div><h3>${p.name}</h3><div class="pc-state">${p.state}</div><p>${p.desc}</p></div>`;
    card.onclick=()=>focusPlace(p);
    listEl.appendChild(card);
  });
  clusters.addLayers(markers);
  if(reopen&&markerByKey[reopen]){const m=markerByKey[reopen];clusters.zoomToShowLayer(m,()=>m.openPopup())}

  document.getElementById('placeCountText').textContent=`Showing ${visible.length} places`;
  document.getElementById('totalBadge').textContent=`${totalPlaces} total in repo`;
  renderCatBtns();
}

// Fly to a place from the list. Load its state first so the moveend auto-load
// can't re-render underneath the popup and close it.
async function focusPlace(p){
  map.closePopup();
  if(isMobile()){document.body.classList.remove('list-open');setTimeout(()=>map.invalidateSize(),50)}
  if(!loadedStates[p.stateCode]&&statesIndex[p.stateCode]){await loadStateData(p.stateCode);render()}
  map.setView([p.lat,p.lng],Math.max(map.getZoom(),12));
  const m=markerByKey[placeKey(p)];
  if(m)clusters.zoomToShowLayer(m,()=>m.openPopup());
}

function renderCatBtns(){
  const w=document.getElementById('catBtns');w.innerHTML='';
  Object.entries(CATS).forEach(([k,c])=>{
    const active=activeCats.has(k);
    const btn=document.createElement('button');
    btn.className='cat-btn'+(active?' active':'');
    btn.style.setProperty('--c',c.color);
    btn.setAttribute('role','checkbox');btn.setAttribute('aria-checked',active);
    const cnt=allPlaces.filter(p=>p.cat===k&&(!selectedState||p.stateCode===selectedState)).length;
    btn.innerHTML=`<span class="cat-check" aria-hidden="true"></span><div class="cat-swatch" style="background:${active?c.color:'var(--border)'}">${ICONS[k]}</div><span>${c.label}</span><span class="cat-cnt">${cnt}</span>`;
    btn.onclick=()=>{if(activeCats.has(k))activeCats.delete(k);else activeCats.add(k);render()};
    w.appendChild(btn);
  });
  const n=activeCats.size,all=Object.keys(CATS).length;
  document.getElementById('catSummary').textContent=n===all?'All':n+'/'+all;
  const lbl=n===all?'Clear':'All';
  document.getElementById('toggleAll').textContent=lbl;document.getElementById('toggleAllM').textContent=lbl;
}

function toggleAllCats(){
  if(activeCats.size===Object.keys(CATS).length)activeCats.clear();
  else Object.keys(CATS).forEach(k=>activeCats.add(k));
  render();
}
const isMobile=()=>window.innerWidth<=760;
// Mobile: categories are a dropdown overlaying the map (no map resize needed)
function setCatPanel(open){
  document.getElementById('filters').classList.toggle('open',open);
  document.getElementById('catToggle').setAttribute('aria-expanded',open);
}
function toggleCatPanel(e){if(!isMobile())return;if(e)e.stopPropagation();setCatPanel(!document.getElementById('filters').classList.contains('open'))}
function closeCatPanel(){setCatPanel(false)}
// Tap anywhere outside the dropdown (including the map) closes it
document.addEventListener('pointerdown',e=>{if(document.getElementById('filters').classList.contains('open')&&!e.target.closest('#filters'))closeCatPanel()},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCatPanel()});
function togglePlaceList(){if(!isMobile())return;document.body.classList.toggle('list-open');setTimeout(()=>map.invalidateSize(),50)}
window.addEventListener('resize',()=>setTimeout(()=>{map.invalidateSize();if(!isMobile())closeCatPanel()},100));

function suggestPlace(){
  const cats=Object.keys(CATS).join(' / ');
  const body=encodeURIComponent(`Hi,\n\nI'd like to suggest a place for BharatYatra:\n\nPlace Name: \nCategory (${cats}): \nState / Region: \nLatitude, Longitude: \nShort Description: \nWikipedia article (optional): \n\nThanks!`);
  window.location.href=`mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent('BharatYatra — Place Suggestion')}&body=${body}`;
  return false;
}

/* ══════ TRIP PLANNER ══════
   Trip = ordered list of place keys ("SC|Name"). Saved in localStorage and
   shareable via #trip=… in the URL. Distances are straight-line (great-circle). */
const TRIP_LS='bharatyatra.trip.v1';
let trip=[];
const tripLayer=L.layerGroup().addTo(map);
const findPlace=k=>allPlaces.find(p=>placeKey(p)===k);
const inTrip=p=>trip.includes(placeKey(p));
function tripBtnHTML(p){
  const k=encodeURIComponent(placeKey(p));
  return inTrip(p)
    ?`<button class="pop-trip in" data-trip="${k}">✓ In your trip — remove</button>`
    :`<button class="pop-trip" data-trip="${k}">+ Add to trip</button>`;
}
function km(a,b){
  const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm=d=>d<10?d.toFixed(1)+' km':Math.round(d).toLocaleString('en-IN')+' km';
function saveTrip(){try{localStorage.setItem(TRIP_LS,JSON.stringify(trip))}catch(e){}}
function tripStops(){return trip.map(findPlace).filter(Boolean)}
function toggleTrip(key){
  const i=trip.indexOf(key);
  if(i>=0)trip.splice(i,1);else trip.push(key);
  tripChanged();
}
function moveStop(i,d){const j=i+d;if(j<0||j>=trip.length)return;[trip[i],trip[j]]=[trip[j],trip[i]];tripChanged()}
function removeStop(i){trip.splice(i,1);tripChanged()}
function clearTrip(){if(trip.length&&confirm('Remove all stops from your trip?')){trip=[];tripChanged()}}
// Nearest-neighbour ordering from the first stop, then 2-opt to remove crossings.
function optimiseTrip(){
  const st=tripStops();if(st.length<3)return;
  const rest=st.slice(1),ord=[st[0]];
  while(rest.length){const last=ord[ord.length-1];let bi=0;rest.forEach((p,i)=>{if(km(last,p)<km(last,rest[bi]))bi=i});ord.push(rest.splice(bi,1)[0])}
  let improved=true;
  while(improved){improved=false;
    for(let i=1;i<ord.length-1;i++)for(let j=i+1;j<ord.length;j++){
      const a=ord[i-1],b=ord[i],c=ord[j],d=ord[j+1];
      const before=km(a,b)+(d?km(c,d):0),after=km(a,c)+(d?km(b,d):0);
      if(after<before-0.01){ord.splice(i,j-i+1,...ord.slice(i,j+1).reverse());improved=true}
    }}
  trip=ord.map(placeKey);tripChanged();
}
function tripLink(){return location.origin+location.pathname+'#trip='+trip.map(encodeURIComponent).join('~')}
async function shareTrip(){
  const url=tripLink();
  try{
    if(navigator.share&&isMobile()){await navigator.share({title:'My BharatYatra trip',url});return}
    await navigator.clipboard.writeText(url);alert('Trip link copied — anyone with it will see the same itinerary.');
  }catch(e){if(e&&e.name==='AbortError')return;prompt('Copy your trip link:',url)}
}
function emailTrip(){
  const st=tripStops();if(!st.length)return;
  const lines=st.map((p,i)=>`${i+1}. ${p.name} (${p.state}) — ${CATS[p.cat]?.label||p.cat}`+(i?`  [${fmtKm(km(st[i-1],p))} from previous]`:''));
  const body=`My BharatYatra itinerary:\n\n${lines.join('\n')}\n\nTotal straight-line distance: ${fmtKm(totalKm(st))}\n\nOpen on the map: ${tripLink()}`;
  window.location.href=`mailto:?subject=${encodeURIComponent('My BharatYatra trip ('+st.length+' stops)')}&body=${encodeURIComponent(body)}`;
}
const totalKm=st=>st.reduce((s,p,i)=>i?s+km(st[i-1],p):0,0);
function toggleTripView(){
  const on=document.body.classList.toggle('trip-view');
  if(on&&isMobile())document.body.classList.add('list-open');
  renderTrip();setTimeout(()=>map.invalidateSize(),50);
}
function tripChanged(){
  saveTrip();renderTrip();
  if(location.hash.startsWith('#trip='))history.replaceState(null,'',location.pathname+location.search);
  // refresh any open popup's button
  map.eachLayer(l=>{if(l._place&&l.isPopupOpen&&l.isPopupOpen()){const p=l._place;l.getPopup().setContent(popupHTML(p,p.img||imgCache[p.wiki]||null))}});
}
function renderTrip(){
  const st=tripStops();
  document.getElementById('tripCount').textContent=st.length;
  // map route
  tripLayer.clearLayers();
  if(st.length>1)L.polyline(st.map(p=>[p.lat,p.lng]),{color:'#2C1810',weight:2.5,opacity:0.75,dashArray:'6 6',interactive:false}).addTo(tripLayer);
  st.forEach((p,i)=>{
    const m=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="route-num">${i+1}</div>`,iconSize:[20,20],iconAnchor:[10,24]}),zIndexOffset:1000,title:`${i+1}. ${p.name}`});
    m.on('click',()=>focusPlace(p));m.addTo(tripLayer);
  });
  // sidebar panel
  const el=document.getElementById('tripPanel');
  if(!st.length){el.innerHTML='<div class="trip-empty"><b>Plan a trip.</b><br>Tap any pin and choose <b>+ Add to trip</b>. Your stops are numbered on the map, joined in order, and saved on this device. You can reorder them, sort them into a shorter route, and share or email the plan.</div>';return}
  let h='';
  st.forEach((p,i)=>{
    const c=CATS[p.cat]||CATS.scenic;
    if(i)h+=`<div class="trip-leg">↓ ${fmtKm(km(st[i-1],p))}</div>`;
    h+=`<div class="trip-stop"><span class="trip-num" style="background:${c.color}">${i+1}</span><div class="trip-info" data-i="${i}"><h3>${p.name}</h3><div>${p.state} · ${c.label}</div></div><div class="trip-ctl"><button onclick="moveStop(${i},-1)" ${i?'':'disabled'} aria-label="Move up">↑</button><button onclick="moveStop(${i},1)" ${i<st.length-1?'':'disabled'} aria-label="Move down">↓</button><button onclick="removeStop(${i})" aria-label="Remove">✕</button></div></div>`;
  });
  h+=`<div class="trip-sum">${st.length} stop${st.length>1?'s':''} · <b>${fmtKm(totalKm(st))}</b> total<small>Straight-line distance; road distance will be longer.</small></div>`;
  h+=`<div class="trip-actions">${st.length>2?'<button onclick="optimiseTrip()" title="Keeps your first stop, reorders the rest">Shortest order</button>':''}<button onclick="fitTrip()">Show on map</button><button class="primary" onclick="shareTrip()">Share link</button><button onclick="emailTrip()">Email</button><button onclick="clearTrip()">Clear</button></div>`;
  el.innerHTML=h;
  el.querySelectorAll('.trip-info').forEach(d=>d.onclick=()=>focusPlace(st[+d.dataset.i]));
}
function fitTrip(){
  const st=tripStops();if(!st.length)return;
  if(isMobile())document.body.classList.remove('list-open');
  setTimeout(()=>{map.invalidateSize();st.length===1?map.setView([st[0].lat,st[0].lng],10):map.fitBounds(st.map(p=>[p.lat,p.lng]),{padding:[40,40],maxZoom:10})},60);
}
// Popup "+ Add to trip" buttons (popups are re-created, so delegate)
document.getElementById('map').addEventListener('click',e=>{
  const b=e.target.closest('.pop-trip');if(!b)return;
  e.preventDefault();e.stopPropagation();toggleTrip(decodeURIComponent(b.dataset.trip));
},true); // capture: Leaflet stops click propagation out of popups
async function initTrip(){
  const clean=keys=>Array.isArray(keys)?[...new Set(keys.filter(k=>typeof k==='string'))].slice(0,60):[];
  // Stops can be non-highlight places, so load their states before resolving them
  async function resolve(keys){
    const states=[...new Set(keys.map(k=>k.split('|')[0]))].filter(sc=>statesIndex[sc]&&!loadedStates[sc]);
    if(states.length){await Promise.all(states.map(loadStateData));render()}
    return keys.filter(k=>findPlace(k));
  }
  const m=location.hash.match(/^#trip=(.*)$/);
  if(m){
    trip=await resolve(clean(m[1].split('~').map(k=>{try{return decodeURIComponent(k)}catch(e){return ''}}).filter(Boolean)));
    if(trip.length){saveTrip();document.body.classList.add('trip-view');if(isMobile())document.body.classList.add('list-open');fitTrip();renderTrip();return}
  }
  let saved=[];try{saved=JSON.parse(localStorage.getItem(TRIP_LS)||'[]')}catch(e){}
  trip=await resolve(clean(saved));
  renderTrip();
}

init().then(initTrip);
</script>
