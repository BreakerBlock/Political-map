<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatYatra — India Travel Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --parchment:#F5EDE0;--surface:#FFFDF8;--surface-hover:#F0E8DA;
  --border:#D9CEBA;--border-light:#E8DFCF;
  --ink:#2C1810;--ink-dim:#7A6B5D;--ink-light:#A89882;
  --accent:#B5452A;--accent-hover:#973A22;
}
body{font-family:'DM Sans',sans-serif;background:var(--parchment);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px}
.brand-flag{width:36px;height:36px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border);flex-shrink:0}
.brand-flag span:nth-child(1){flex:1;background:#FF9933}
.brand-flag span:nth-child(2){flex:1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;color:#000080;line-height:1}
.brand-flag span:nth-child(3){flex:1;background:#138808}
header h1{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700}
header h1 span{color:var(--accent)}
.header-sub{font-size:0.58rem;text-transform:uppercase;letter-spacing:0.16em;color:var(--ink-dim)}
.btn-suggest{padding:8px 18px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;font-size:0.75rem;font-weight:600;transition:background 0.15s;display:flex;align-items:center;gap:7px;text-decoration:none}
.btn-suggest:hover{background:var(--accent-hover)}

.main-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:330px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface)}

.filters{padding:14px 16px 12px;border-bottom:1px solid var(--border-light)}
.filters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.filters-head h2{font-family:'Cormorant Garamond',serif;font-size:0.9rem;font-weight:700;color:var(--ink-dim)}
.toggle-all{font-size:0.65rem;color:var(--accent);cursor:pointer;font-weight:600;border:none;background:none;font-family:inherit}
.toggle-all:hover{text-decoration:underline}

.cat-list{display:flex;flex-direction:column;gap:3px}
.cat-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border-radius:8px;border:1.5px solid transparent;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;font-size:0.77rem;transition:all 0.12s;text-align:left}
.cat-btn:hover{background:var(--surface-hover)}
.cat-btn.active{border-color:color-mix(in srgb,var(--c) 32%,var(--border));background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.cat-swatch{width:24px;height:24px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cat-swatch svg{width:14px;height:14px}
.cat-label{flex:1;font-weight:500;line-height:1.2}
.cat-cnt{font-size:0.62rem;color:var(--ink-light);background:var(--parchment);padding:2px 7px;border-radius:10px;font-weight:600;min-width:26px;text-align:center;flex-shrink:0}
.cat-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.12s}
.cat-btn.active .cat-check{background:var(--c);border-color:var(--c)}
.cat-btn.active .cat-check svg{opacity:1}
.cat-check svg{width:10px;height:10px;opacity:0;stroke:#fff;stroke-width:2.5;fill:none}

.search-wrap{padding:10px 16px;border-bottom:1px solid var(--border-light);position:relative}
.search-wrap input{width:100%;padding:9px 12px 9px 36px;border-radius:8px;border:1px solid var(--border);background:var(--parchment);color:var(--ink);font-family:inherit;font-size:0.8rem;outline:none}
.search-wrap input::placeholder{color:var(--ink-light)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,69,42,0.08)}
.s-icon{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-light);fill:none;stroke-width:2}

.place-count{padding:7px 16px;font-size:0.68rem;color:var(--ink-light);border-bottom:1px solid var(--border-light)}

.place-list{flex:1;overflow-y:auto;padding:4px 8px}
.place-list::-webkit-scrollbar{width:4px}
.place-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.place-card{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.1s;display:flex;align-items:flex-start;gap:10px}
.place-card+.place-card{border-top:1px solid var(--border-light)}
.place-card:hover{background:var(--surface-hover)}
.pc-swatch{width:22px;height:22px;border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.pc-swatch svg{width:12px;height:12px}
.place-card h3{font-size:0.8rem;font-weight:600}
.pc-state{font-size:0.64rem;color:var(--ink-light);margin-top:1px}
.place-card p{font-size:0.68rem;color:var(--ink-dim);margin-top:3px;line-height:1.35}

#map{flex:1;background:#CDE3F1;position:relative}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--border)!important;font-size:16px!important;width:32px!important;height:32px!important;line-height:32px!important}

/* Popup with image */
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--ink)!important;border-radius:12px!important;box-shadow:0 6px 24px rgba(44,24,16,0.18)!important;border:1px solid var(--border)!important;overflow:hidden!important;padding:0!important}
.leaflet-popup-tip{background:var(--surface)!important}
.leaflet-popup-content{font-family:'DM Sans',sans-serif!important;font-size:13px!important;line-height:1.5!important;margin:0!important;width:250px!important}
.pop-img-wrap{width:250px;height:140px;overflow:hidden;background:var(--parchment);display:none}
.pop-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.pop-body{padding:12px 15px 14px}
.pop-name{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px;line-height:1.2}
.pop-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pop-cat{font-size:10px;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.1em;margin-top:3px}
.pop-state{font-size:12px;color:var(--ink-dim);margin-top:5px}
.pop-desc{font-size:12px;color:var(--ink-dim);margin-top:6px;line-height:1.45}
.leaflet-popup-close-button{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,0.5);top:6px!important;right:6px!important;font-size:18px!important;z-index:10}

.disclaimer{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:800;font-size:0.56rem;color:var(--ink-light);background:rgba(255,253,248,0.92);padding:3px 12px;border-radius:4px;white-space:nowrap}

.loading-overlay{position:absolute;inset:0;z-index:900;background:rgba(245,237,224,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--ink-dim);gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.state-label{font-family:'DM Sans',sans-serif!important;font-size:9.5px!important;font-weight:600!important;color:rgba(44,24,16,0.38)!important;letter-spacing:0.07em!important;text-transform:uppercase!important;white-space:nowrap!important;text-shadow:0 0 5px rgba(245,237,224,1)!important;pointer-events:none!important;text-align:center!important}

.city-label{font-family:'DM Sans',sans-serif!important;pointer-events:none!important;white-space:nowrap!important}
.city-label .cl-inner{display:flex;align-items:center;gap:4px}
.city-label .cl-dot{width:5px;height:5px;border-radius:50%;background:#5A4A3A;border:1px solid #fff;box-shadow:0 0 2px rgba(0,0,0,0.4);flex-shrink:0}
.city-label .cl-name{font-size:10px;font-weight:500;color:#4A3A2C;text-shadow:0 0 3px #fff,0 0 5px #fff,0 0 6px #fff}
.city-label.tier1 .cl-name{font-weight:600;font-size:10.5px}

@media(max-width:760px){
  .sidebar{width:100%;max-height:42vh;border-right:none;border-bottom:1px solid var(--border)}
  .main-wrap{flex-direction:column}
  .header-sub{display:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-flag"><span></span><span>☸</span><span></span></div>
    <div>
      <h1>Bharat<span>Yatra</span></h1>
      <div class="header-sub">Interactive India Travel Planner</div>
    </div>
  </div>
  <a class="btn-suggest" href="#" onclick="return suggestPlace()">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 3.5l6 4 6-4M1 3.5v7a1 1 0 001 1h10a1 1 0 001-1v-7M1 3.5a1 1 0 011-1h10a1 1 0 011 1"/></svg>
    Suggest a Place
  </a>
</header>

<div class="main-wrap">
  <aside class="sidebar">
    <div class="filters">
      <div class="filters-head">
        <h2>Explore by Category</h2>
        <button class="toggle-all" id="toggleAll" onclick="toggleAllCats()">Deselect All</button>
      </div>
      <div class="cat-list" id="catBtns"></div>
    </div>
    <div class="search-wrap">
      <svg class="s-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
      <input type="text" id="searchInput" placeholder="Search places, states…" oninput="render()">
    </div>
    <div class="place-count" id="placeCount"></div>
    <div class="place-list" id="placeList"></div>
  </aside>
  <div id="map">
    <div class="loading-overlay" id="loader"><div class="spinner"></div>Loading places…</div>
    <div class="disclaimer">Boundary as per Survey of India · Map for reference only · Not to scale</div>
  </div>
</div>

<script>
/* ═════════════════════════════════════════════════════════
   CONFIGURATION — the only things you need to change
   ═════════════════════════════════════════════════════════ */
const DATA_URL = 'places.json';   // same-repo file; GitHub Pages serves it automatically
const CONTACT_EMAIL = 'your@email.com';  // overridden by meta.contactEmail in places.json

/* ═════════════════════════════════════════════════════════
   CATEGORY ICONS — inline SVG, crisp on all platforms
   ═════════════════════════════════════════════════════════ */
const ICONS={
scenic:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21l4-10 4 10"/><path d="M2 21l5-12 3 6"/><circle cx="18" cy="5" r="2"/></svg>`,
religious:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8M8 6h8M12 10v12M7 22h10"/></svg>`,
fauna:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8c0-2 2-4 4-3 1-2 4-3 4-1 0-2 3-1 4 1 2-1 4 1 4 3-1 3-4 5-8 9C8 13 5 11 4 8z"/></svg>`,
history:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4"/></svg>`,
arts:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="14" r="1.5"/><path d="M12 2a10 10 0 0110 10c0 2-2 2-3 1s-2-1-3 0-2 2-4 2-3-1-3-1a10 10 0 013-12z"/></svg>`,
cuisine:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M5 12c0-4 3-8 7-8s7 4 7 8M5 12v2c0 3 3 5 7 5s7-2 7-5v-2"/></svg>`,
adventure:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l-4 8h8l-4-8z"/><path d="M8 10l-5 10h18l-5-10"/><path d="M12 8v14"/></svg>`,
festivals:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M5.6 5.6l2.8 2.8M2 12h4M5.6 18.4l2.8-2.8M12 18v4M18.4 18.4l-2.8-2.8M22 12h-4M18.4 5.6l-2.8 2.8"/><circle cx="12" cy="12" r="3"/></svg>`,
};

const DEFAULT_CATS={
scenic:{label:'Scenic Views',color:'#1A7A6D'},
religious:{label:'Religious & Spiritual',color:'#C4563A'},
fauna:{label:'Wildlife & Nature',color:'#3D7A35'},
history:{label:'History & Heritage',color:'#8B6914'},
arts:{label:'Arts, Crafts & Textiles',color:'#8B3FA0'},
cuisine:{label:'Cuisine & Food',color:'#D06B25'},
adventure:{label:'Adventure & Trekking',color:'#2260BD'},
festivals:{label:'Festivals & Culture',color:'#C73E6B'},
};

const STATE_LABELS=[
{name:"JAMMU & KASHMIR",lat:33.6,lng:74.9},{name:"LADAKH",lat:34.4,lng:77.6},
{name:"HIMACHAL",lat:31.9,lng:77.3},{name:"PUNJAB",lat:30.9,lng:75.4},
{name:"HARYANA",lat:29.2,lng:76.1},{name:"UTTARAKHAND",lat:30.1,lng:79.2},
{name:"RAJASTHAN",lat:26.6,lng:73.0},{name:"UTTAR PRADESH",lat:26.8,lng:80.9},
{name:"BIHAR",lat:25.7,lng:85.6},{name:"GUJARAT",lat:22.6,lng:71.6},
{name:"MADHYA PRADESH",lat:23.4,lng:78.6},{name:"CHHATTISGARH",lat:21.5,lng:82.0},
{name:"JHARKHAND",lat:23.6,lng:85.5},{name:"WEST BENGAL",lat:24.0,lng:87.9},
{name:"ODISHA",lat:20.4,lng:84.6},{name:"MAHARASHTRA",lat:19.3,lng:76.2},
{name:"TELANGANA",lat:17.9,lng:79.1},{name:"ANDHRA PRADESH",lat:15.7,lng:79.9},
{name:"KARNATAKA",lat:14.8,lng:76.1},{name:"GOA",lat:15.35,lng:74.05},
{name:"KERALA",lat:10.4,lng:76.4},{name:"TAMIL NADU",lat:11.0,lng:78.5},
{name:"ASSAM",lat:26.3,lng:92.9},{name:"MEGHALAYA",lat:25.5,lng:91.2},
{name:"ARUNACHAL PRADESH",lat:28.1,lng:94.6},{name:"NAGALAND",lat:26.1,lng:94.4},
{name:"MANIPUR",lat:24.7,lng:93.9},{name:"MIZORAM",lat:23.3,lng:92.9},
{name:"TRIPURA",lat:23.8,lng:91.7},{name:"SIKKIM",lat:27.6,lng:88.5},
{name:"DELHI",lat:28.65,lng:77.1},
];

let CATS={...DEFAULT_CATS};
let places=[];
const activeCats=new Set(Object.keys(CATS));
let markerLayer;
const imgCache={};

/* ═════════════════════════════════════════════════════════
   MAP — CartoDB Voyager (no political boundary labels)
   ═════════════════════════════════════════════════════════ */
const map=L.map('map',{zoomControl:true,minZoom:4,maxBounds:[[3,60],[40,102]],maxBoundsViscosity:0.85}).setView([22.5,80],5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{
  attribution:'© <a href="https://carto.com">CARTO</a> © OSM',maxZoom:18,subdomains:'abcd'
}).addTo(map);

markerLayer=L.layerGroup().addTo(map);

/* ─── India official boundary (Survey of India, full J&K) ───
   Loaded from india-boundary.geojson in the same repo.       */
async function loadBoundary(){
  try{
    const res=await fetch('india-boundary.geojson');
    if(!res.ok)throw new Error('http '+res.status);
    const geo=await res.json();

    // Dim everything outside India: world rectangle with India's rings as holes
    const coords=geo.features[0].geometry.coordinates; // MultiPolygon [ [ [ring], ...], ... ]
    const holes=coords.map(poly=>poly[0].map(pt=>[pt[1],pt[0]])); // exterior rings → [lat,lng]
    const world=[[-89,-179],[-89,179],[89,179],[89,-179]];
    L.polygon([world,...holes],{
      stroke:false,fillColor:'#B7AE9C',fillOpacity:0.35,interactive:false
    }).addTo(map);

    // India boundary line + subtle warm fill
    L.geoJSON(geo,{
      style:{color:'#7A4A22',weight:2,opacity:0.8,fillColor:'#FFF8EC',fillOpacity:0.12},
      interactive:false
    }).addTo(map);
  }catch(e){console.warn('Boundary not loaded:',e.message)}
}
loadBoundary();

/* ─── City labels (two tiers by zoom) ─── */
const CITIES_T1=[
  ["New Delhi",28.61,77.21],["Mumbai",19.08,72.88],["Kolkata",22.57,88.36],
  ["Chennai",13.08,80.27],["Bengaluru",12.97,77.59],["Hyderabad",17.39,78.49],
  ["Ahmedabad",23.02,72.57],["Pune",18.52,73.86],["Jaipur",26.92,75.79],
  ["Lucknow",26.85,80.95],["Srinagar",34.08,74.80],["Leh",34.15,77.58],
  ["Chandigarh",30.73,76.78],["Bhopal",23.26,77.41],["Patna",25.59,85.14],
  ["Guwahati",26.14,91.74],["Kochi",9.93,76.27],["Panaji",15.49,73.83],
  ["Visakhapatnam",17.69,83.22],["Nagpur",21.15,79.09],["Varanasi",25.32,83.01],
  ["Amritsar",31.63,74.87],["Indore",22.72,75.86]
];
const CITIES_T2=[
  ["Shimla",31.10,77.17],["Dehradun",30.32,78.03],["Jammu",32.73,74.86],
  ["Ranchi",23.34,85.31],["Raipur",21.25,81.63],["Bhubaneswar",20.30,85.82],
  ["Thiruvananthapuram",8.52,76.94],["Madurai",9.93,78.12],["Coimbatore",11.02,76.96],
  ["Mysuru",12.30,76.64],["Mangaluru",12.91,74.86],["Surat",21.17,72.83],
  ["Vadodara",22.31,73.19],["Rajkot",22.30,70.80],["Jodhpur",26.24,73.02],
  ["Udaipur",24.58,73.68],["Jaisalmer",26.92,70.91],["Agra",27.18,78.02],
  ["Kanpur",26.45,80.33],["Prayagraj",25.44,81.85],["Gwalior",26.22,78.18],
  ["Aurangabad",19.88,75.34],["Nashik",20.00,73.79],["Vijayawada",16.51,80.65],
  ["Tirupati",13.63,79.42],["Imphal",24.82,93.94],["Aizawl",23.73,92.72],
  ["Kohima",25.67,94.11],["Itanagar",27.10,93.62],["Shillong",25.57,91.88],
  ["Agartala",23.83,91.28],["Gangtok",27.33,88.62],["Siliguri",26.73,88.40],
  ["Amaravati",16.51,80.52],["Puducherry",11.94,79.83],["Port Blair",11.62,92.73],
  ["Kavaratti",10.57,72.64],["Dharamshala",32.22,76.32],["Rishikesh",30.09,78.27]
];
function cityMarker(c,tier){
  return L.marker([c[1],c[2]],{
    icon:L.divIcon({
      className:'city-label '+tier,
      html:`<div class="cl-inner"><span class="cl-dot"></span><span class="cl-name">${c[0]}</span></div>`,
      iconSize:[110,14],iconAnchor:[3,7]
    }),
    interactive:false
  });
}
const cityT1Layer=L.layerGroup(CITIES_T1.map(c=>cityMarker(c,'tier1')));
const cityT2Layer=L.layerGroup(CITIES_T2.map(c=>cityMarker(c,'tier2')));

// State labels (only visible at country zoom, hidden when zoomed in)
const stateLayer=L.layerGroup().addTo(map);
STATE_LABELS.forEach(s=>{
  L.marker([s.lat,s.lng],{
    icon:L.divIcon({className:'state-label',html:s.name,iconSize:[120,14],iconAnchor:[60,7]}),
    interactive:false
  }).addTo(stateLayer);
});

function syncLabelLayers(){
  const z=map.getZoom();
  // States: zoom 4-7
  if(z>=8){if(map.hasLayer(stateLayer))map.removeLayer(stateLayer)}
  else{if(!map.hasLayer(stateLayer))map.addLayer(stateLayer)}
  // Major cities: zoom 5+
  if(z>=5){if(!map.hasLayer(cityT1Layer))map.addLayer(cityT1Layer)}
  else{if(map.hasLayer(cityT1Layer))map.removeLayer(cityT1Layer)}
  // Secondary cities: zoom 6+
  if(z>=6){if(!map.hasLayer(cityT2Layer))map.addLayer(cityT2Layer)}
  else{if(map.hasLayer(cityT2Layer))map.removeLayer(cityT2Layer)}
}
map.on('zoomend',syncLabelLayers);
syncLabelLayers();

/* ═════════════════════════════════════════════════════════
   DATA
   ═════════════════════════════════════════════════════════ */
async function loadData(){
  try{
    const res=await fetch(DATA_URL+'?v='+Date.now());
    if(!res.ok)throw new Error('http '+res.status);
    const data=await res.json();
    if(data.categories)CATS=data.categories;
    if(data.places)places=data.places;
    if(data.meta&&data.meta.contactEmail)window._contactEmail=data.meta.contactEmail;
    activeCats.clear();
    Object.keys(CATS).forEach(k=>activeCats.add(k));
  }catch(e){
    console.warn('places.json not reachable:',e.message);
    places=[];
    document.getElementById('placeCount').textContent='Could not load places.json — check the file exists in your repo.';
  }
  document.getElementById('loader').style.display='none';
  render();
}

/* ═════════════════════════════════════════════════════════
   IMAGES — auto-fetched from Wikipedia when popup opens
   Priority: place.img (your URL) → place.wiki (Wikipedia thumbnail)
   ═════════════════════════════════════════════════════════ */
async function getImage(p){
  if(p.img)return p.img;
  if(!p.wiki)return null;
  if(imgCache[p.wiki]!==undefined)return imgCache[p.wiki];
  try{
    const res=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.wiki));
    if(!res.ok)throw 0;
    const j=await res.json();
    const url=(j.thumbnail&&j.thumbnail.source)?j.thumbnail.source.replace(/\/\d+px-/,'/500px-'):null;
    imgCache[p.wiki]=url;
    return url;
  }catch(e){imgCache[p.wiki]=null;return null}
}

/* ═════════════════════════════════════════════════════════
   MARKERS & POPUPS
   ═════════════════════════════════════════════════════════ */
function makeIcon(cat){
  const c=CATS[cat]||DEFAULT_CATS.scenic;
  return L.divIcon({
    className:'',
    html:`<div style="width:26px;height:26px;border-radius:50%;background:${c.color};border:2px solid #fff;box-shadow:0 1px 6px rgba(44,24,16,0.35);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.12s" onmouseover="this.style.transform='scale(1.28)'" onmouseout="this.style.transform='scale(1)'">${ICONS[cat]||ICONS.scenic}</div>`,
    iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-10]
  });
}

function popupHTML(p,imgUrl){
  const c=CATS[p.cat]||DEFAULT_CATS.scenic;
  return `
    <div class="pop-img-wrap" style="${imgUrl?'display:block':''}">${imgUrl?`<img src="${imgUrl}" alt="${p.name}" onerror="this.parentElement.style.display='none'">`:''}</div>
    <div class="pop-body">
      <div class="pop-name"><span class="pop-dot" style="background:${c.color}"></span>${p.name}</div>
      <div class="pop-cat">${c.label}</div>
      <div class="pop-state">📍 ${p.state}</div>
      <div class="pop-desc">${p.desc}</div>
    </div>`;
}

/* ═════════════════════════════════════════════════════════
   RENDER
   ═════════════════════════════════════════════════════════ */
function render(){
  markerLayer.clearLayers();
  const listEl=document.getElementById('placeList');listEl.innerHTML='';
  const q=(document.getElementById('searchInput').value||'').toLowerCase();

  const visible=places.filter(p=>
    activeCats.has(p.cat)&&
    (!q||p.name.toLowerCase().includes(q)||p.state.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q))
  );
  visible.sort((a,b)=>{
    const d=Object.keys(CATS).indexOf(a.cat)-Object.keys(CATS).indexOf(b.cat);
    return d||a.name.localeCompare(b.name);
  });

  visible.forEach(p=>{
    const c=CATS[p.cat]||DEFAULT_CATS.scenic;
    const m=L.marker([p.lat,p.lng],{icon:makeIcon(p.cat)});
    m.bindPopup(popupHTML(p,p.img||null),{maxWidth:250,minWidth:250});
    m.on('popupopen',async()=>{
      const url=await getImage(p);
      if(url&&m.getPopup())m.getPopup().setContent(popupHTML(p,url));
    });
    markerLayer.addLayer(m);

    const card=document.createElement('div');
    card.className='place-card';
    card.innerHTML=`<div class="pc-swatch" style="background:${c.color}">${ICONS[p.cat]||ICONS.scenic}</div><div><h3>${p.name}</h3><div class="pc-state">${p.state}</div><p>${p.desc}</p></div>`;
    card.onclick=()=>{map.setView([p.lat,p.lng],10);m.openPopup()};
    listEl.appendChild(card);
  });

  document.getElementById('placeCount').textContent=`Showing ${visible.length} of ${places.length} places`;
  renderCatBtns();
}

function renderCatBtns(){
  const wrap=document.getElementById('catBtns');wrap.innerHTML='';
  Object.entries(CATS).forEach(([key,c])=>{
    const cnt=places.filter(p=>p.cat===key).length;
    const active=activeCats.has(key);
    const btn=document.createElement('button');
    btn.className='cat-btn'+(active?' active':'');
    btn.style.setProperty('--c',c.color);
    btn.innerHTML=`<div class="cat-swatch" style="background:${c.color}">${ICONS[key]||ICONS.scenic}</div><span class="cat-label">${c.label}</span><span class="cat-cnt">${cnt}</span><span class="cat-check"><svg viewBox="0 0 12 12"><path d="M2 6l3 3 5-5"/></svg></span>`;
    btn.onclick=()=>{if(activeCats.has(key))activeCats.delete(key);else activeCats.add(key);render()};
    wrap.appendChild(btn);
  });
}

function toggleAllCats(){
  const btn=document.getElementById('toggleAll');
  if(activeCats.size===Object.keys(CATS).length){activeCats.clear();btn.textContent='Select All'}
  else{Object.keys(CATS).forEach(k=>activeCats.add(k));btn.textContent='Deselect All'}
  render();
}

/* ═════════════════════════════════════════════════════════
   SUGGEST A PLACE (opens visitor's email client)
   ═════════════════════════════════════════════════════════ */
function suggestPlace(){
  const email=window._contactEmail||CONTACT_EMAIL;
  const cats=Object.keys(CATS).join(' / ');
  const body=encodeURIComponent(
`Hi,

I'd like to suggest a place for BharatYatra:

Place Name: 
Category (${cats}): 
State / Region: 
Latitude, Longitude: 
Short Description (one line): 
Photo link (optional): 

Thanks!`);
  window.location.href=`mailto:${email}?subject=${encodeURIComponent('BharatYatra — Place Suggestion')}&body=${body}`;
  return false;
}
